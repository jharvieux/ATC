packages:
  - "apps/*"
  - "packages/*"
overrides:
  postcss: ">=8.5.26 <9"
  qs: ^6.15.2
  tmp: ^0.2.6
  # #661 — uuid <11.1.1 has GHSA-w5hq-g745-h8pq (moderate, missing buffer
  # bounds check in v3/v5/v6 when buf is provided). exceljs only uses
  # uuidv4(), so the bug is not reachable here — but pnpm audit flags it
  # regardless. Pin >=11.1.1 across all transitive paths to clear audit.
  # Also patches the dev-only @lhci/cli>uuid path.
  uuid: ">=11.1.1"
  # Security patches for transitive deps flagged by Dependabot on pnpm-lock.yaml:
  #   undici  GHSA-vxpw-j846-p89q / -hm92-r4w5-c3mj / -vmh5-mc38-953g (high)
  #   js-yaml GHSA-h67p-54hq-rp68 (moderate) · esbuild GHSA-g7r4-m6w7-qqqr (low)
  #   @babel/core GHSA-4x5r-pxfx-6jf8 (low)
  undici: ">=7.29.0 <8"
  js-yaml: ">=4.3.1 <5"
  esbuild: ">=0.28.1 <0.29"
  "@babel/core": ">=7.29.6 <8"
  # #2128 — browserslist <=4.28.6 mishandles inherited keys in custom stats.
  # Keep every transitive consumer on the patched 4.x line.
  browserslist: ">=4.28.8 <5"
  # Keep transitive security patches on the majors required by their parents.
  # A single unscoped override would force incompatible ESM/API majors into
  # older PostCSS and glob consumers.
  "nanoid@3": "3.3.18"
  "nanoid@5": "5.1.16"
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  "@opentelemetry/propagator-jaeger@2": "2.10.0"
  body-parser: ">=1.20.6 <2"
  fast-uri: ">=3.1.5 <4"
  ip-address: "10.3.1"
  pdfjs-dist: "6.2.108"
  protobufjs: ">=7.6.5 <8"
  sharp: ">=0.35.0 <0.36"
  # #2109 — extract-zip has no patched release for GHSA-jmr9-qjv8-65gv.
  # Puppeteer 25 removes @puppeteer/browsers' vulnerable extract-zip path.
  "lighthouse@12.6.1>puppeteer-core": "25.1.0"
allowBuilds:
  '@sentry/cli': false
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
