project_id = "atc-main"

[db]
major_version = 17

# Dev-only UIs and log pipeline disabled for local DAST.
# analytics (Logflare) pulls in the `vector` sidecar, which bind-mounts the
# docker socket — Colima's mount layer rejects that, so the whole stack would
# tear down on the analytics health check. Disabling it keeps the core
# (Postgres, PostgREST, GoTrue, Storage, Realtime, Kong) healthy.
[studio]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false

# edge_runtime (Deno) fetches function deps from deno.land/std + jsr.io on boot;
# one of those module fetches 404s and fails the stack health check. Not needed
# to DAST the Next.js app (its routes are Next.js, not Supabase edge functions).
[edge_runtime]
enabled = false
