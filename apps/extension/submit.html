<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to Knowledge Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #111;
      background: #fff;
      padding: 20px;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 12px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.15);
    }
    textarea { resize: vertical; min-height: 120px; }
    .char-count { font-size: 11px; color: #9ca3af; margin-top: -8px; margin-bottom: 12px; }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-secondary { background: #f3f4f6; color: #374151; margin-left: 8px; }
    .btn-secondary:hover { background: #e5e7eb; }
    .actions { display: flex; align-items: center; }
    .error { color: #dc2626; font-size: 12px; margin-top: 10px; }
    .success {
      text-align: center;
      padding: 32px 20px;
    }
    .success .check { font-size: 40px; margin-bottom: 12px; }
    .success h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .success p { color: #666; font-size: 13px; }
    .not-signed-in {
      text-align: center;
      padding: 32px 20px;
      color: #666;
    }
    .not-signed-in p { margin-bottom: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="main-view">
    <h1>Add to Knowledge Base</h1>
    <p class="subtitle">Review and submit clipped content</p>

    <label for="content">Content</label>
    <textarea id="content" placeholder="Selected text will appear here…"></textarea>
    <div class="char-count"><span id="char-count">0</span> characters</div>

    <label for="source-url">Source URL</label>
    <input id="source-url" type="url" placeholder="https://…" />

    <label for="page-title">Page Title</label>
    <input id="page-title" type="text" placeholder="Page title" />

    <div class="actions">
      <button class="btn-primary" id="submit-btn">Submit to Knowledge Base</button>
      <button class="btn-secondary" id="cancel-btn">Cancel</button>
    </div>
    <div class="error hidden" id="error-msg"></div>
  </div>

  <div id="success-view" class="hidden success">
    <div class="check">✓</div>
    <h2>Added to Knowledge Base</h2>
    <p>Your content has been submitted and will appear in the review queue.</p>
  </div>

  <div id="not-signed-in-view" class="hidden not-signed-in">
    <p>You are not signed in.</p>
    <p>Click the extension icon in your toolbar to sign in first.</p>
  </div>

  <script src="submit.js"></script>
</body>
</html>
