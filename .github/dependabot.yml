version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "automerge-candidate"
    ignore:
      # Each semver-major ignore here is watched by the monthly
      # dependency-ignore-watch workflow (.github/dependency-ignore-watch.json):
      # it polls the gating package's peerDependencies and opens a re-test
      # issue when the blocked major is admitted, so these don't rot silently.
      #
      # vite 8.x breaks vitest 4's JSX/TSX transform — three test files fail
      # to load at module-resolution time (#330, 2026-05-28). Hold the major
      # bump until vitest is confirmed-compatible (gated_by: vitest).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # eslint 10 removed context.getFilename(); eslint-plugin-react 7.37.5
      # still calls it, crashing the react/display-name rule (#373,
      # 2026-05-30). Hold the major until eslint-plugin-react's
      # peerDependencies.eslint admits ^10 (gated_by: eslint-plugin-react).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # react 19 removed ReactCurrentDispatcher from the internal API surface;
      # dependencies that access React.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED
      # break at import time (#601, 2026-06-03). Also @types/react 19 drops the implicit
      # children prop from React.FC (#602) — hold both until the ecosystem catches up.
      # (gated_by: any library using React internals / React.FC children)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
