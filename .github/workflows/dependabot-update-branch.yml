# Branch protection on dev requires up-to-date branches, so a Dependabot PR
# with auto-merge armed can stall forever once dev advances past it —
# Dependabot does not self-rebase merely-behind (non-conflicting) PRs
# (observed: #957 sat BEHIND until manually rebased, 2026-06-10). This cron
# updates eligible branches so auto-merge can fire.
#
# Token: a fine-grained PAT (GH_PAT), NOT GITHUB_TOKEN. Pushes made with
# GITHUB_TOKEN do not trigger pull_request workflows (recursion guard), so an
# update-branch would leave the new head with no CI and auto-merge would never
# fire — strictly worse than the stall. PAT-authored pushes trigger CI
# normally. GH_PAT needs Contents: write + Pull requests: write (+ Checks and
# Commit statuses: read for `gh pr checks`). This cron runs in a normal context
# (not a Dependabot event trigger), so a regular Actions secret is sufficient.
name: dependabot-update-branch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Lock GITHUB_TOKEN to nothing — all API calls use GH_PAT, whose grants come
# from the PAT's own fine-grained permissions. Do not "fix" this by adding
# contents: write here; it would widen GITHUB_TOKEN for no reason.
permissions: {}

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update eligible Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --author 'app/dependabot' --state open \
            --json number,mergeStateStatus,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND") | .number')
          if [ -z "$prs" ]; then
            echo "No BEHIND Dependabot PRs with auto-merge armed — nothing to do."
            exit 0
          fi
          for n in $prs; do
            # PRs with failing checks belong to dependabot-retry-ci; updating
            # them just burns CI minutes on a branch that can't merge anyway.
            # JSON bucket field, not positional columns (gh's table layout is
            # undocumented); gh pr checks exits non-zero while checks are
            # pending, so a fallback "0" prefers update over skip on transient
            # errors — auto-merge still won't fire unless checks pass.
            FAILING=$(gh pr checks "$n" --repo "$GITHUB_REPOSITORY" \
              --json bucket --jq '[.[] | select(.bucket == "fail")] | length' 2>/dev/null || echo "0")
            if [ "$FAILING" -gt 0 ]; then
              echo "PR #$n has $FAILING failing check(s) — skipping (dependabot-retry-ci owns failures)."
              continue
            fi
            echo "Updating branch for PR #$n"
            gh pr update-branch "$n" --repo "$GITHUB_REPOSITORY"
          done
