name: slop-check

# D-091 — Advisory PR check that scans the diff for AI-slop patterns
# (orphan TODOs, narrating comments, re-throw catch blocks, single-expression
# wrappers). Posts findings as a PR comment. Non-blocking — exit code is
# always 0 and the workflow does not gate merge.

on:
  pull_request:
    branches:
      - dev
      - "release/*"

jobs:
  slop-check:
    name: Slop check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run slop-check against PR base
        id: slop
        env:
          SLOP_CHECK_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          pnpm slop-check > slop-report.md
          {
            echo 'report<<SLOP_EOF'
            cat slop-report.md
            echo 'SLOP_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing slop-check comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Slop check —"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: ${{ steps.slop.outputs.report }}
          edit-mode: replace
