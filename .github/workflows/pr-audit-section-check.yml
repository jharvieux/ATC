# Enforce that every human-authored PR has been audited by both the
# d091-reviewer and pre-pr-reviewer subagents — and that the audit
# reflects the current head commit, not a stale earlier state.
#
# Two layers of evidence:
#
#   Layer 1 — PR body: `## Audit` block with a Status line. This is the
#   human-readable summary the maintainer reads when reviewing the PR.
#
#   Layer 2 — PR comments: both subagents post their full report as a
#   PR comment with a stable marker (`<!-- d091-audit:v1 diff:<hash> -->`
#   and `<!-- prepr-audit:v1 diff:<hash> -->`). The `diff:<hash>` value
#   is a sha256 of the PR's current effective diff (sorted filename+patch
#   pairs). The check recomputes the hash from the PR files API and passes
#   iff a marker comment with the matching hash exists — timestamps become
#   irrelevant, so update-branch merge commits never stale the audit.
#
#   Transition fallback: comments without a `diff:` field (pre-dating hash
#   binding) are accepted if their createdAt is after the latest code-
#   changing commit's timestamp. This fallback will be removed once all
#   open PRs have rotated through a hash-bound audit.
#
#   "Code-changing" means the commit's diff has at least one file entry.
#   Empty commits — used to refresh the workflow's PR-body snapshot when
#   the body changes — are walked over: the audit threshold is the date
#   of the previous non-empty commit, not the empty commit at HEAD.
#
# Layer 2 is the load-bearing part — Layer 1 alone could be fabricated
# in the PR body without ever running the subagents. The marker-on-comment
# scheme isn't unforgeable (any collaborator could post the marker
# manually), but it does force the maintainer to either invoke the
# subagent OR consciously type a fake comment — versus the current
# Layer 1 where pasting text into the body is the path of least
# resistance.
#
# Exemptions:
#   - dependabot[bot] — version-only PRs, no code logic to review
#   - claude-code-action[bot] / claude[bot] / github-actions[bot] — bots
#     don't review themselves; the human who triggered the bot owns the PR
#   - Doc-only PRs — every changed file matches *.md, docs/**, or specs/**.
#     The audit agents review application behavior; running them on a doc
#     edit just burns Sonnet tokens to learn there's nothing to review.
#
# Listener events include `edited` so that updating the PR body re-runs
# the check (without `edited`, you can't fix a failed run by editing
# the description — you'd have to push a no-op commit).

name: pr-audit-section-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-audit-section-check:
    name: pr-audit-section-check
    runs-on: ubuntu-latest
    # The job runs unconditionally so it ALWAYS reports a status.
    # Bot-authored PRs short-circuit to success inside the steps below —
    # if we job-level `if:` skipped them, branch protection would treat
    # the missing status as failed and block dependabot auto-merges.
    #
    # Job name MUST match the required-status-check context name set on
    # branch protection. The status-check context defaults to the JOB name
    # (not the workflow `name:`), so this is named `pr-audit-section-check`
    # to match the required-status-check entry added via gh api.
    steps:
      - name: Detect bot author (auto-pass)
        id: bot-check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR" in
            dependabot\[bot\]|github-actions\[bot\]|claude\[bot\]|claude-code-action\[bot\])
              echo "::notice::Bot-authored PR ($AUTHOR) — skipping audit-section check"
              echo "is_bot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_bot=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Doc-only short-circuit. The PR is exempt iff EVERY changed file
      # matches one of the doc patterns: anything ending in .md, anything
      # under docs/ (any depth), or anything under specs/ (any depth). Any
      # single non-doc file disqualifies the PR and the normal audit gates
      # apply. The list is fetched via the GraphQL `files` field rather
      # than parsing diff URLs, so renames/deletes are handled correctly.
      - name: Detect doc-only PR (auto-pass)
        id: doc-only-check
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh pr view --json files` returns up to 100 files; paginate
          # via the REST endpoint to be safe on large doc PRs.
          #
          # awk must read gh's output to EOF — do NOT `exit` on the first
          # match. Exiting early closes the pipe while `gh --paginate` is
          # still streaming, so gh dies with SIGPIPE (exit 141); under
          # `set -o pipefail` that fails the whole step intermittently
          # (the race depends on how fast gh flushes). The `!seen` guard
          # keeps only the first non-doc filename while still draining stdin.
          NON_DOC=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' \
            | awk '
                /\.md$/        { next }
                /^docs\//      { next }
                /^specs\//     { next }
                !seen          { print; seen = 1 }
              ')

          if [ -z "$NON_DOC" ]; then
            echo "::notice::Doc-only PR — skipping audit-section check"
            echo "is_doc_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc file present: $NON_DOC — audit required"
            echo "is_doc_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify ## Audit section is present and non-trivial
        if: steps.bot-check.outputs.is_bot != 'true' && steps.doc-only-check.outputs.is_doc_only != 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ -z "${BODY:-}" ]; then
            echo "::error::PR body is empty — no Audit section."
            echo ""
            echo "Per CLAUDE.md, every PR description must include an '## Audit' block."
            echo "Run d091-reviewer + pre-pr-reviewer subagents and paste their combined"
            echo "output into the PR body under an '## Audit' heading."
            exit 1
          fi

          # Extract from "## Audit" to next "## " (or EOF).
          # awk: print lines between the marker and the next h2.
          SECTION=$(printf '%s' "$BODY" | awk '
            BEGIN { capture = 0 }
            /^## Audit/ { capture = 1; next }
            /^## / && capture { capture = 0 }
            capture { print }
          ')

          if [ -z "$SECTION" ]; then
            echo "::error::No '## Audit' section found in PR body."
            echo ""
            echo "Add an '## Audit' heading + the d091-reviewer + pre-pr-reviewer output."
            echo "See CLAUDE.md 'Pull requests' for the mandatory format."
            exit 1
          fi

          # TBD / placeholder rejection.
          if printf '%s' "$SECTION" | grep -qiE "^[[:space:]]*(tbd|todo|to be done|n/a)[[:space:]]*$"; then
            echo "::error::Audit section is a TBD placeholder — actually run the audit."
            exit 1
          fi

          # Must contain a Status line — the subagent always emits one.
          if ! printf '%s' "$SECTION" | grep -qE "^[[:space:]]*\*?\*?Status\*?\*?[[:space:]]*:"; then
            echo "::error::Audit section is missing a 'Status:' line."
            echo ""
            echo "The pre-pr-reviewer subagent emits a Status line (e.g."
            echo "'Status: clean — no findings' or 'Status: 2 must-fix')."
            echo "Make sure you pasted the full subagent output, not just notes."
            exit 1
          fi

          # Non-trivial content: at least 50 chars after the heading.
          CHAR_COUNT=$(printf '%s' "$SECTION" | wc -c | tr -d ' ')
          if [ "$CHAR_COUNT" -lt 50 ]; then
            echo "::error::Audit section is too short ($CHAR_COUNT chars) — actually paste the audit output."
            exit 1
          fi

          echo "✓ Audit section present (chars=$CHAR_COUNT)"
          printf '%s' "$SECTION" | head -20

      - name: Verify both subagent comments are bound to the current diff (hash-first, timestamp fallback)
        if: steps.bot-check.outputs.is_bot != 'true' && steps.doc-only-check.outputs.is_doc_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Walk back through any empty commits at HEAD to find the most
          # recent commit that actually changed files. An empty commit
          # (e.g. `git commit --allow-empty` used to refresh THIS check's
          # PR-body snapshot) doesn't invalidate prior audits — the audited
          # tree is identical. The walk is capped to keep this bounded on
          # weird branches.
          # Structured so that on every break, $COMMIT_JSON is the
          # response for the current $EFFECTIVE_SHA — the limit check runs
          # BEFORE we advance, so we never leave the loop with a stale
          # cached JSON for the prior SHA.
          EFFECTIVE_SHA="$HEAD_SHA"
          WALK_LIMIT=20
          i=0
          while :; do
            COMMIT_JSON=$(gh api "repos/$REPO/commits/$EFFECTIVE_SHA")
            FILE_COUNT=$(printf '%s' "$COMMIT_JSON" | jq '.files | length')
            if [ "$FILE_COUNT" -gt 0 ]; then
              break
            fi
            PARENT=$(printf '%s' "$COMMIT_JSON" | jq -r '.parents[0].sha // empty')
            if [ -z "$PARENT" ]; then
              echo "::notice::No parent for empty commit $EFFECTIVE_SHA; using it as the threshold."
              break
            fi
            if [ "$i" -ge "$WALK_LIMIT" ]; then
              echo "::notice::Walk limit ($WALK_LIMIT empty commits) reached; using $EFFECTIVE_SHA as the threshold."
              break
            fi
            echo "::notice::Skipping empty commit $EFFECTIVE_SHA (no file changes) → $PARENT"
            EFFECTIVE_SHA="$PARENT"
            i=$((i + 1))
          done

          HEAD_DATE=$(printf '%s' "$COMMIT_JSON" | jq -r '.commit.committer.date')
          if [ -z "$HEAD_DATE" ]; then
            echo "::error::Could not resolve committed date for effective SHA $EFFECTIVE_SHA."
            exit 1
          fi
          if [ "$EFFECTIVE_SHA" = "$HEAD_SHA" ]; then
            echo "Head commit $HEAD_SHA committed at $HEAD_DATE"
          else
            echo "Effective audit threshold $EFFECTIVE_SHA committed at $HEAD_DATE (walked past $i empty commit(s) from HEAD $HEAD_SHA)"
          fi

          # Compute a hash of the current PR's effective diff so audit
          # comments can be bound to an exact tree state rather than a
          # timestamp. An update-branch that doesn't change any source file
          # produces the same hash → existing audit comments still pass
          # without a repost, killing the merge-train friction (issue #924).
          #
          # Hash input: sorted (filename + patch) pairs from the PR files
          # API. Binaries (no `patch` field) substitute (filename + sha +
          # status) so their blob identity is still captured.
          #
          # `--paginate --slurp` collects all pages into a JSON array of
          # arrays; `[.[][]]` flattens before sort.
          DIFF_HASH=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files" \
            | jq -r '[.[][]] | sort_by(.filename)[] | if .patch then (.filename + "\n" + .patch) else (.filename + "\n" + .sha + "\n" + .status) end' \
            | sha256sum | cut -d' ' -f1)
          echo "Diff hash for PR #$PR_NUMBER: $DIFF_HASH"

          # check_marker: pass if we find a marker comment whose embedded
          # diff hash matches DIFF_HASH (new-style). Transition fallback:
          # for comments pre-dating hash binding, accept if the newest one
          # was posted after HEAD_DATE (timestamp rule). Remove the fallback
          # branch once all open PRs have rotated through a hash-bound audit
          # (tracked in issue #926).
          #
          # `--paginate --slurp` + `.[][]` is the same flatten pattern used
          # for PR files above; it avoids the "newest comment on first page"
          # gotcha with unsorted pagination.
          check_marker() {
            local marker_prefix="$1"   # e.g. "d091-audit:v1"
            local name="$2"

            # Fetch all comments whose body contains the marker prefix
            # (matches both old <!-- d091-audit:v1 --> and new
            # <!-- d091-audit:v1 diff:... -->).
            local ALL_COMMENTS
            ALL_COMMENTS=$(gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" \
              | jq --arg M "<!-- $marker_prefix" '[.[][] | select(.body | contains($M))]')

            if [ "$(printf '%s' "$ALL_COMMENTS" | jq 'length')" -eq 0 ]; then
              echo "::error::Missing $name audit comment (marker <!-- $marker_prefix -->)."
              echo ""
              echo "Run the $name subagent on this PR; it posts the audit as a"
              echo "comment with that marker. The marker is invisible in the"
              echo "rendered Markdown but the workflow looks for it in the body."
              return 1
            fi

            # New-style check: a comment body must contain diff:<DIFF_HASH>.
            local MATCHING
            MATCHING=$(printf '%s' "$ALL_COMMENTS" \
              | jq --arg H "diff:$DIFF_HASH" '[.[] | select(.body | contains($H))] | length')
            if [ "$MATCHING" -gt 0 ]; then
              echo "✓ $name audit comment hash matches current diff ($DIFF_HASH)"
              return 0
            fi

            # Timestamp fallback: newest comment without a diff:<hash> marker
            # field (pre-hash-binding era). Use a precise regex so "diff:"
            # appearing in prose inside an audit report body doesn't
            # misclassify the comment as new-style (issue #924).
            local NEWEST_OLD
            NEWEST_OLD=$(printf '%s' "$ALL_COMMENTS" \
              | jq -r '[.[] | select(.body | test("<!-- [a-z0-9:-]+ diff:[0-9a-f]+") | not)] | sort_by(.created_at) | last | .created_at // empty')
            if [ -n "$NEWEST_OLD" ] && ! [ "$NEWEST_OLD" \< "$HEAD_DATE" ]; then
              echo "✓ $name audit comment posted $NEWEST_OLD (timestamp fallback — no diff hash)"
              return 0
            fi

            # Both checks failed — report why.
            if [ -n "$NEWEST_OLD" ]; then
              echo "::error::$name audit comment is stale (timestamp fallback)."
              echo ""
              echo "Newest legacy comment at $NEWEST_OLD; effective code commit"
              echo "($EFFECTIVE_SHA) at $HEAD_DATE."
              echo "Re-run the $name subagent — it will embed the current diff hash."
            else
              echo "::error::$name audit comment diff hash mismatch."
              echo ""
              echo "Expected diff hash: $DIFF_HASH"
              echo "No existing comment embeds this hash. Re-run the $name subagent."
            fi
            return 1
          }

          # Collect both failures so the author sees them together rather
          # than fix-one-push-fix-the-other.
          FAILED=0
          check_marker "d091-audit:v1"  "d091-reviewer"   || FAILED=1
          check_marker "prepr-audit:v1" "pre-pr-reviewer" || FAILED=1
          [ "$FAILED" -eq 0 ]
