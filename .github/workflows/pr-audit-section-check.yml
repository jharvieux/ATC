# Enforce that every human-authored PR has been audited by both the
# d091-reviewer and pre-pr-reviewer subagents — and that the audit
# reflects the current head commit, not a stale earlier state.
#
# Two layers of evidence:
#
#   Layer 1 — PR body: `## Audit` block with a Status line. This is the
#   human-readable summary the maintainer reads when reviewing the PR.
#
#   Layer 2 — PR comments: both subagents post their full report as a
#   PR comment with a stable marker (`<!-- d091-audit:v1 -->` and
#   `<!-- prepr-audit:v1 -->`). Each comment's createdAt is compared
#   against the head commit's committedDate, so an audit run BEFORE the
#   most recent push doesn't pass.
#
# Layer 2 is the load-bearing part — Layer 1 alone could be fabricated
# in the PR body without ever running the subagents. The marker-on-comment
# scheme means the bot identity (`github-actions` for the gh CLI calls
# the agent makes) is the audit trail.
#
# Exemptions:
#   - dependabot[bot] — version-only PRs, no code logic to review
#   - claude-code-action[bot] / claude[bot] / github-actions[bot] — bots
#     don't review themselves; the human who triggered the bot owns the PR
#
# Listener events include `edited` so that updating the PR body re-runs
# the check (without `edited`, you can't fix a failed run by editing
# the description — you'd have to push a no-op commit).

name: pr-audit-section-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-audit-section-check:
    name: pr-audit-section-check
    runs-on: ubuntu-latest
    # The job runs unconditionally so it ALWAYS reports a status.
    # Bot-authored PRs short-circuit to success inside the steps below —
    # if we job-level `if:` skipped them, branch protection would treat
    # the missing status as failed and block dependabot auto-merges.
    #
    # Job name MUST match the required-status-check context name set on
    # branch protection. The status-check context defaults to the JOB name
    # (not the workflow `name:`), so this is named `pr-audit-section-check`
    # to match the required-status-check entry added via gh api.
    steps:
      - name: Detect bot author (auto-pass)
        id: bot-check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR" in
            dependabot\[bot\]|github-actions\[bot\]|claude\[bot\]|claude-code-action\[bot\])
              echo "::notice::Bot-authored PR ($AUTHOR) — skipping audit-section check"
              echo "is_bot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_bot=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Verify ## Audit section is present and non-trivial
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ -z "${BODY:-}" ]; then
            echo "::error::PR body is empty — no Audit section."
            echo ""
            echo "Per CLAUDE.md, every PR description must include an '## Audit' block."
            echo "Run d091-reviewer + pre-pr-reviewer subagents and paste their combined"
            echo "output into the PR body under an '## Audit' heading."
            exit 1
          fi

          # Extract from "## Audit" to next "## " (or EOF).
          # awk: print lines between the marker and the next h2.
          SECTION=$(printf '%s' "$BODY" | awk '
            BEGIN { capture = 0 }
            /^## Audit/ { capture = 1; next }
            /^## / && capture { capture = 0 }
            capture { print }
          ')

          if [ -z "$SECTION" ]; then
            echo "::error::No '## Audit' section found in PR body."
            echo ""
            echo "Add an '## Audit' heading + the d091-reviewer + pre-pr-reviewer output."
            echo "See CLAUDE.md 'Pull requests' for the mandatory format."
            exit 1
          fi

          # TBD / placeholder rejection.
          if printf '%s' "$SECTION" | grep -qiE "^[[:space:]]*(tbd|todo|to be done|n/a)[[:space:]]*$"; then
            echo "::error::Audit section is a TBD placeholder — actually run the audit."
            exit 1
          fi

          # Must contain a Status line — the subagent always emits one.
          if ! printf '%s' "$SECTION" | grep -qE "^[[:space:]]*\*?\*?Status\*?\*?[[:space:]]*:"; then
            echo "::error::Audit section is missing a 'Status:' line."
            echo ""
            echo "The pre-pr-reviewer subagent emits a Status line (e.g."
            echo "'Status: clean — no findings' or 'Status: 2 must-fix')."
            echo "Make sure you pasted the full subagent output, not just notes."
            exit 1
          fi

          # Non-trivial content: at least 50 chars after the heading.
          CHAR_COUNT=$(printf '%s' "$SECTION" | wc -c | tr -d ' ')
          if [ "$CHAR_COUNT" -lt 50 ]; then
            echo "::error::Audit section is too short ($CHAR_COUNT chars) — actually paste the audit output."
            exit 1
          fi

          echo "✓ Audit section present (chars=$CHAR_COUNT)"
          printf '%s' "$SECTION" | head -20

      - name: Verify both subagent comments posted AFTER the latest commit
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Head commit's authored time — what the audits must beat.
          HEAD_DATE=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
          if [ -z "$HEAD_DATE" ]; then
            echo "::error::Could not resolve committed date for head SHA $HEAD_SHA."
            exit 1
          fi
          echo "Head commit $HEAD_SHA committed at $HEAD_DATE"

          # ISO 8601 timestamps sort lexicographically, so plain string
          # comparison is correct here.
          check_marker() {
            local marker="$1"
            local name="$2"
            local newest
            newest=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq "[.[] | select(.body | contains(\"<!-- $marker -->\"))] | sort_by(.created_at) | last | .created_at // empty")
            if [ -z "$newest" ]; then
              echo "::error::Missing $name audit comment (marker <!-- $marker -->)."
              echo ""
              echo "Run the $name subagent on this PR; it posts the audit as a"
              echo "comment with that marker. The marker is invisible in the"
              echo "rendered Markdown but the workflow looks for it in the body."
              return 1
            fi
            if [ "$newest" \< "$HEAD_DATE" ]; then
              echo "::error::$name audit comment is stale."
              echo ""
              echo "Newest $name comment was posted at $newest, but the latest"
              echo "commit ($HEAD_SHA) was made at $HEAD_DATE. Re-run the"
              echo "$name subagent so it posts a fresh comment for the current"
              echo "head."
              return 1
            fi
            echo "✓ $name audit comment posted $newest (>= head $HEAD_DATE)"
          }

          check_marker "d091-audit:v1" "d091-reviewer"
          check_marker "prepr-audit:v1" "pre-pr-reviewer"
