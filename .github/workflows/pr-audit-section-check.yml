# Enforce that every human-authored PR has been audited by both the
# d091-reviewer and pre-pr-reviewer subagents — and that the audit
# reflects the current head commit, not a stale earlier state.
#
# The gate is a single layer of evidence: hash-bound PR comments.
#
#   Both subagents post their full report as a PR comment with a stable
#   marker (`<!-- d091-audit:v1 diff:<hash> -->` and
#   `<!-- prepr-audit:v1 diff:<hash> -->`). The `diff:<hash>` value is a
#   sha256 of the PR's current effective diff (sorted filename+patch pairs).
#   The check recomputes the hash from the PR files API and passes iff a
#   marker comment with the matching hash exists — timestamps are
#   irrelevant, so update-branch merge commits never stale the audit, while
#   any commit that changes the effective diff requires a fresh audit.
#
# This is the load-bearing guarantee: it forces the maintainer to either
# invoke the subagent OR consciously type a fake comment. (The scheme isn't
# unforgeable — any collaborator could paste the marker manually — but it
# raises the bar well above editing prose.)
#
# The PR-body `## Audit` block is NO LONGER ENFORCED here (was "Layer 1").
# It was only a human-readable summary and a frequent source of
# non-substantive failures (missing Status: line, <50 chars, TBD), and it
# added no real assurance — it could be fabricated without running the
# agents. The pre-pr-reviewer now writes that summary into the body itself;
# it is advisory, not gated.
#
# Exemptions:
#   - dependabot[bot] — version-only PRs, no code logic to review
#   - claude-code-action[bot] / claude[bot] / github-actions[bot] — bots
#     don't review themselves; the human who triggered the bot owns the PR
#   - Doc-only PRs — every changed file matches *.md, docs/**, or specs/**.
#     The audit agents review application behavior; running them on a doc
#     edit just burns Sonnet tokens to learn there's nothing to review.
#
# Listener events include `edited` so that updating the PR body re-runs
# the check (without `edited`, you can't fix a failed run by editing
# the description — you'd have to push a no-op commit).

name: pr-audit-section-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-audit-section-check:
    name: pr-audit-section-check
    runs-on: ubuntu-latest
    # The job runs unconditionally so it ALWAYS reports a status.
    # Bot-authored PRs short-circuit to success inside the steps below —
    # if we job-level `if:` skipped them, branch protection would treat
    # the missing status as failed and block dependabot auto-merges.
    #
    # Job name MUST match the required-status-check context name set on
    # branch protection. The status-check context defaults to the JOB name
    # (not the workflow `name:`), so this is named `pr-audit-section-check`
    # to match the required-status-check entry added via gh api.
    steps:
      - name: Detect bot author (auto-pass)
        id: bot-check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR" in
            dependabot\[bot\]|github-actions\[bot\]|claude\[bot\]|claude-code-action\[bot\])
              echo "::notice::Bot-authored PR ($AUTHOR) — skipping audit-section check"
              echo "is_bot=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_bot=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Doc-only short-circuit. The PR is exempt iff EVERY changed file
      # matches one of the doc patterns: anything ending in .md, anything
      # under docs/ (any depth), or anything under specs/ (any depth). Any
      # single non-doc file disqualifies the PR and the normal audit gates
      # apply. The list is fetched via the GraphQL `files` field rather
      # than parsing diff URLs, so renames/deletes are handled correctly.
      - name: Detect doc-only PR (auto-pass)
        id: doc-only-check
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh pr view --json files` returns up to 100 files; paginate
          # via the REST endpoint to be safe on large doc PRs.
          #
          # awk must read gh's output to EOF — do NOT `exit` on the first
          # match. Exiting early closes the pipe while `gh --paginate` is
          # still streaming, so gh dies with SIGPIPE (exit 141); under
          # `set -o pipefail` that fails the whole step intermittently
          # (the race depends on how fast gh flushes). The `!seen` guard
          # keeps only the first non-doc filename while still draining stdin.
          NON_DOC=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' \
            | awk '
                /\.md$/        { next }
                /^docs\//      { next }
                /^specs\//     { next }
                !seen          { print; seen = 1 }
              ')

          if [ -z "$NON_DOC" ]; then
            echo "::notice::Doc-only PR — skipping audit-section check"
            echo "is_doc_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc file present: $NON_DOC — audit required"
            echo "is_doc_only=false" >> "$GITHUB_OUTPUT"
          fi

      # NOTE (D-2xx): the PR-body "## Audit" section is no longer enforced here.
      # The load-bearing guarantee — both subagents ran on the EXACT current diff —
      # lives entirely in the hash-bound marker comments checked by the step below.
      # The body block was only a human-readable summary and a frequent source of
      # non-substantive failures (missing Status: line, <50 chars, TBD). The
      # pre-pr-reviewer now writes that summary into the body itself; it's advisory,
      # not gated. See CLAUDE.md "Pull requests".
      - name: Verify both subagent comments are bound to the current diff (hash-first, timestamp fallback)
        if: steps.bot-check.outputs.is_bot != 'true' && steps.doc-only-check.outputs.is_doc_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Compute a hash of the current PR's effective diff so audit
          # comments can be bound to an exact tree state rather than a
          # timestamp. An update-branch that doesn't change any source file
          # produces the same hash → existing audit comments still pass
          # without a repost, killing the merge-train friction (issue #924).
          #
          # Hash input: sorted (filename + patch) pairs from the PR files
          # API. Binaries (no `patch` field) substitute (filename + sha +
          # status) so their blob identity is still captured.
          #
          # `--paginate --slurp` collects all pages into a JSON array of
          # arrays; `[.[][]]` flattens before sort.
          DIFF_HASH=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files" \
            | jq -r '[.[][]] | sort_by(.filename)[] | if .patch then (.filename + "\n" + .patch) else (.filename + "\n" + .sha + "\n" + .status) end' \
            | sha256sum | cut -d' ' -f1)
          echo "Diff hash for PR #$PR_NUMBER: $DIFF_HASH"

          # check_marker: pass if we find a marker comment whose embedded
          # diff hash matches DIFF_HASH. `--paginate --slurp` + `.[][]` is
          # the same flatten pattern used for PR files above; it avoids the
          # "newest comment on first page" gotcha with unsorted pagination.
          check_marker() {
            local marker_prefix="$1"   # e.g. "d091-audit:v1"
            local name="$2"

            # Fetch all comments whose body contains the marker prefix
            # (matches both old <!-- d091-audit:v1 --> and new
            # <!-- d091-audit:v1 diff:... -->).
            local ALL_COMMENTS
            ALL_COMMENTS=$(gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" \
              | jq --arg M "<!-- $marker_prefix" '[.[][] | select(.body | contains($M))]')

            if [ "$(printf '%s' "$ALL_COMMENTS" | jq 'length')" -eq 0 ]; then
              echo "::error::Missing $name audit comment (marker <!-- $marker_prefix -->)."
              echo ""
              echo "Run the $name subagent on this PR; it posts the audit as a"
              echo "comment with that marker. The marker is invisible in the"
              echo "rendered Markdown but the workflow looks for it in the body."
              return 1
            fi

            # New-style check: a comment body must contain diff:<DIFF_HASH>.
            local MATCHING
            MATCHING=$(printf '%s' "$ALL_COMMENTS" \
              | jq --arg H "diff:$DIFF_HASH" '[.[] | select(.body | contains($H))] | length')
            if [ "$MATCHING" -gt 0 ]; then
              echo "✓ $name audit comment hash matches current diff ($DIFF_HASH)"
              return 0
            fi

            echo "::error::$name audit comment diff hash mismatch."
            echo ""
            echo "Expected diff hash: $DIFF_HASH"
            echo "No existing comment embeds this hash. Re-run the $name subagent."
            return 1
          }

          # Collect both failures so the author sees them together rather
          # than fix-one-push-fix-the-other.
          FAILED=0
          check_marker "d091-audit:v1"  "d091-reviewer"   || FAILED=1
          check_marker "prepr-audit:v1" "pre-pr-reviewer" || FAILED=1
          [ "$FAILED" -eq 0 ]
