name: deploy

on:
  pull_request:
    branches:
      - dev
      - "release/*"
  push:
    branches:
      - dev
      - "release/*"

jobs:
  # ============================================================
  # CI block — runs on every PR and push (jobs 1-4)
  # ============================================================

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: pnpm -r typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm -r lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need enough history for `git diff origin/<base>...HEAD` to find
          # a merge base. fetch-depth: 0 = full history. Slightly slower
          # checkout (~5s on this repo) but correct on any divergence depth.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide test scope (full vs affected)
        id: scope
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/ci-decide-tests.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Run full vitest suite (with coverage)
        if: steps.scope.outputs.mode == 'full'
        run: |
          echo "::notice::Running FULL test suite — ${{ steps.scope.outputs.reason }}"
          pnpm test

      - name: Run affected vitest tests
        if: steps.scope.outputs.mode == 'affected'
        run: |
          echo "::notice::Running affected tests — ${{ steps.scope.outputs.reason }}"
          # `vitest related <files>` resolves test files transitively via vitest's
          # own import graph. Run from repo root; vitest discovers config.
          pnpm --silent vitest related ${{ steps.scope.outputs.files }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cve-scan:
    name: CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on critical CVEs
        run: pnpm audit --audit-level=critical

      - name: Warn on high CVEs
        run: |
          pnpm audit --audit-level=high --json 2>/dev/null | \
            node -e "
              const chunks = [];
              process.stdin.on('data', d => chunks.push(d));
              process.stdin.on('end', () => {
                try {
                  const report = JSON.parse(Buffer.concat(chunks).toString());
                  const vulns = report.vulnerabilities || {};
                  Object.values(vulns)
                    .filter(v => v.severity === 'high')
                    .forEach(v => {
                      console.log('::warning::High CVE in ' + v.name + ': ' + (v.via?.[0]?.url || 'see pnpm audit'));
                    });
                } catch (_) {}
              });
            " || true

  rls-snapshot-diff:
    name: RLS Snapshot Diff
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check RLS drift (fail on PR and release/*)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/')
        run: pnpm rls:check

      - name: Check RLS drift (warn on dev push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: pnpm rls:check || echo "::warning::RLS drift detected on dev — run pnpm rls:snapshot and commit db/rls-snapshot-{main,rag}.sql"

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests (MSW replay)
        run: pnpm test:contracts

  cross-tenant-probe:
    name: Cross-Tenant Probe
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, secret-scan]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cross-tenant probe
        run: pnpm test:cross-tenant

  # ============================================================
  # db-copy block — production → staging clone (job 5)
  # Runs only on push to release/* branches
  # ============================================================

  db-copy:
    name: Copy Prod DB to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs:
      [
        typecheck,
        lint,
        test,
        secret-scan,
        cve-scan,
        rls-snapshot-diff,
        cross-tenant-probe,
        contract-tests,
      ]
    environment: staging
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump production database
        run: |
          pg_dump "$PROD_DB_URL" \
            --no-owner \
            --no-acl \
            --format=custom \
            --file=prod_dump.pgdump

      - name: Terminate staging connections and restore
        run: |
          psql "$DB_URL" -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid();"
          pg_restore \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --dbname="$DB_URL" \
            prod_dump.pgdump

      - name: Apply staging fixups
        run: |
          psql "$DB_URL" -f scripts/staging-fixups.sql

  # ============================================================
  # Staging block — deploy + E2E + smoke (job 6)
  # Runs only on push to release/* branches
  # ============================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [db-copy]
    environment:
      name: staging
      url: https://staging.ai-travelconcierge.com
    env:
      DB_URL: ${{ secrets.DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEST_OVERRIDE_EMAIL: ${{ secrets.TEST_OVERRIDE_EMAIL }}
      TEST_OVERRIDE_PHONE: ${{ secrets.TEST_OVERRIDE_PHONE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations
        run: |
          npx supabase db push --db-url "$DB_URL"

      - name: Vercel deploy (preview)
        run: |
          vercel pull --environment=preview --yes --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN

      - name: Run Playwright E2E tests
        env:
          BASE_URL: https://staging.ai-travelconcierge.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
        run: |
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Smoke test staging
        run: |
          sleep 20
          curl -f https://staging.ai-travelconcierge.com/api/health

  # ============================================================
  # Production block — deploy + smoke + tag + auto-merge (job 7)
  # Runs only on push to release/* branches
  # ============================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [deploy-staging]
    environment:
      name: production
      url: https://ai-travelconcierge.com
    env:
      DB_URL: ${{ secrets.DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations to production
        run: |
          npx supabase db push --db-url "$DB_URL"

      - name: Vercel deploy (production)
        run: |
          vercel pull --environment=production --yes --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --target=production --token=$VERCEL_TOKEN

      - name: Smoke test production
        run: |
          sleep 30
          curl -f https://ai-travelconcierge.com/api/health

      - name: Create release tag
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Auto-merge release branch back to dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head "$GITHUB_REF_NAME" \
            --title "chore: merge $GITHUB_REF_NAME back to dev" \
            --label "release-merge" \
            --body "Automated post-release merge."
          gh pr merge --merge --auto || { echo "Auto-merge failed or conflict — resolve manually. PR URL above."; exit 0; }
