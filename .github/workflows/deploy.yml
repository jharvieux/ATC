name: deploy

on:
  pull_request:
    branches:
      - dev
      - "release/*"
  push:
    branches:
      - dev
      - "release/*"
  # merge_group fires when GitHub's merge queue builds a speculative merge
  # commit for a PR queued into `dev`. Every required CI check must run on this
  # event or the queue can never merge (a required check that never reports is
  # treated as failing). Additive — the pull_request/push triggers above are
  # unchanged, so today's non-queue flow is unaffected. The deploy-* jobs stay
  # inert on merge_group: they gate on push/workflow_dispatch + a dev/release
  # ref, none of which a merge_group event satisfies. (#1896 groundwork.)
  merge_group:
  workflow_dispatch: # manual re-trigger for release/* when push didn't fire deploy.yml

jobs:
  # ============================================================
  # Doc-only detection — lets the required CI jobs skip on PRs
  # whose every changed path is a doc (*.md, docs/**, specs/**).
  # A skipped required job is reported as passing by branch
  # protection (unlike paths-ignore, which never reports and would
  # strand the PR), so the required contexts stay green on doc PRs.
  # On push events base_ref is empty, so this always returns
  # code=true and full CI runs — doc-skip is a PR-only optimization.
  # ============================================================

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      workflows_only: ${{ steps.f.outputs.workflows_only }}
      rag_changed: ${{ steps.rag.outputs.rag_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect atc-rag changes (#1829)
        # Gates the beta-tier RAG deploy job so an ordinary atc-main-only PR
        # merge to dev doesn't trigger a redundant atc-rag deploy. Diffs
        # against the pre-push SHA on `push` (dev-merge) and against the PR
        # base on `pull_request`; PROD RAG deploys (deploy-production) are
        # NOT gated by this — they deploy unconditionally alongside atc-main
        # on every release cut, same as atc-main's own prod step has no
        # change filter.
        id: rag
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE" || true
            DIFF_RANGE="origin/$BASE...HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="$BEFORE...HEAD"
          else
            # workflow_dispatch, or a push with no usable `before` (e.g. a
            # brand-new branch) — fail SAFE, same posture as doc-detection
            # below: uncertainty means deploy, not silently skip.
            echo "::notice::No diffable range for atc-rag change detection — defaulting to rag_changed=true."
            echo "rag_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$DIFF_RANGE" 2>/dev/null); then
            echo "::warning::git diff failed — defaulting to rag_changed=true."
            echo "rag_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(apps/rag/|packages/contracts/|packages/config/|pnpm-lock\.yaml$)'; then
            echo "rag_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rag_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect non-doc changes
        id: f
        env:
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # push: always run full CI
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail SAFE: any uncertainty (fetch/diff error) => code=true => run the
          # full required suite. code=false (skip) only on a CONFIRMED doc-only diff.
          # NOT set -e: a git failure must fall through to code=true, not abort —
          # an aborted/failed detect-changes would skip the dependent required jobs,
          # which branch protection treats as passing (fail-open).
          git fetch --no-tags origin "$BASE" || true
          if ! CHANGED=$(git diff --name-only "origin/$BASE...HEAD" 2>/dev/null); then
            echo "::warning::git diff failed — defaulting to code=true (run full CI)."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NONDOC=$(printf '%s\n' "$CHANGED" | grep -vE '(\.md$|^docs/|^specs/)' || true)
          if [ -z "$NONDOC" ]; then
            echo "::notice::Doc-only PR — required CI jobs will skip (reported as passing)."
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"
          NON_WORKFLOW=$(printf '%s\n' "$NONDOC" | grep -v '^\.github/workflows/' || true)
          if [ -z "$NON_WORKFLOW" ]; then
            echo "::notice::Workflow-only PR — app-code CI will skip (reported as passing)."
            echo "workflows_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # CI block — runs on every PR and push (jobs 1-4)
  # Each gated: skip only on a doc-only pull_request; always run on push.
  # ============================================================

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: (github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') && needs.detect-changes.outputs.workflows_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: pnpm -r typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: (github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') && needs.detect-changes.outputs.workflows_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm -r lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need enough history for `git diff origin/<base>...HEAD` to find
          # a merge base. fetch-depth: 0 = full history. Slightly slower
          # checkout (~5s on this repo) but correct on any divergence depth.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workflow wiring tests
        if: needs.detect-changes.outputs.workflows_only == 'true'
        run: pnpm vitest run tests/unit/scripts/check-critical-rag-db.test.ts tests/unit/workflows/deploy-test-db-provenance.test.ts

      - name: Require critical isolation test databases for workflow-only changes
        if: needs.detect-changes.outputs.workflows_only == 'true'
        env:
          ISOLATION_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
        run: pnpm tsx scripts/check-critical-rag-db.ts

      - name: Decide test scope (full vs affected)
        id: scope
        if: needs.detect-changes.outputs.workflows_only != 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          # No `shell:` key on this step, so the implicit default shell is
          # `bash -e {0}` — NOT `-o pipefail` (only `shell: bash` adds that).
          # `$?` after the pipe below would read `tee`'s exit code, not
          # ci-decide-tests.mjs's, letting a script failure through with
          # GITHUB_OUTPUT silently empty/stale (D-349; same shape as #1864).
          # Capture `${PIPESTATUS[0]}` and fail the step explicitly instead.
          set +e
          node scripts/ci-decide-tests.mjs | tee -a "$GITHUB_OUTPUT"
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Run full vitest suite (with coverage)
        if: needs.detect-changes.outputs.workflows_only != 'true' && steps.scope.outputs.mode == 'full'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "::notice::Running FULL test suite — $REASON"
          pnpm test

      - name: Run affected vitest tests
        if: needs.detect-changes.outputs.workflows_only != 'true' && steps.scope.outputs.mode == 'affected'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "::notice::Running affected tests — $REASON"
          # `vitest related <files>` resolves test files transitively via vitest's
          # own import graph. Run from repo root; vitest discovers config.
          # Each path in `files` is single-quoted by ci-decide-tests.mjs and the
          # script rejects shell metacharacters (#571), so the splat is injection-safe.
          pnpm --silent vitest related ${{ steps.scope.outputs.files }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cve-scan:
    name: CVE Scan
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: (github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') && needs.detect-changes.outputs.workflows_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on critical CVEs
        run: pnpm audit --audit-level=critical

      - name: Warn on high CVEs
        run: |
          pnpm audit --audit-level=high --json 2>/dev/null | \
            node -e "
              const chunks = [];
              process.stdin.on('data', d => chunks.push(d));
              process.stdin.on('end', () => {
                try {
                  const report = JSON.parse(Buffer.concat(chunks).toString());
                  const vulns = report.vulnerabilities || {};
                  Object.values(vulns)
                    .filter(v => v.severity === 'high')
                    .forEach(v => {
                      console.log('::warning::High CVE in ' + v.name + ': ' + (v.via?.[0]?.url || 'see pnpm audit'));
                    });
                } catch (_) {}
              });
            " || true

  rls-snapshot-diff:
    name: RLS Snapshot Diff
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: (github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') && needs.detect-changes.outputs.workflows_only != 'true'
    # This is the single uninterrupted provenance holder for the shared main
    # and RAG test DBs. Reset, exact-revision migration apply, snapshot checks,
    # and every live acceptance suite stay in this one job: separate jobs with
    # the same concurrency group release the lock between them, allowing a
    # different revision to reset the DB before the first revision's tests.
    # cancel-in-progress: false is deliberate: cancelling mid-reset would leave
    # the DB half-rebuilt for the next holder. Also mitigates #1904 (nightly RAG
    # push vs a concurrent dev-merge push).
    #
    # KNOWN LIMITATION: a GitHub concurrency group keeps only ONE pending run
    # per group; if a third run is queued while one is running and one pending,
    # the older pending run is superseded (cancelled) and its required checks
    # would need a re-run. Under today's manual one-PR-at-a-time train that
    # 3-way contention is rare; the merge queue with "max entries to build = 1"
    # is the real serializer and removes it entirely — which is the point of
    # this groundwork. See the PR body.
    concurrency:
      group: shared-test-db
      cancel-in-progress: false
    outputs:
      db_probe_sha: ${{ steps.revision-provenance.outputs.db_probe_sha }}
      acceptance_mode: ${{ steps.revision-provenance.outputs.acceptance_mode }}
    permissions:
      contents: read
      # issues: write — the dev-push drift backstop below opens/reuses a tracked issue.
      issues: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
      APP_BASE_URL: ${{ secrets.APP_STAGING_URL }}
      CROSS_TENANT_FIXTURES: "true"
      STRIPE_SECRET_KEY: sk_test_ci-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the migration-ledger pre-check below can diff
          # origin/<base>...HEAD to find this branch's added migrations.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration-ledger collision pre-check (#1660)
        # Before pushing, confirm none of this branch's ADDED migrations has a
        # version that's already in the shared test DB ledger under a
        # DIFFERENT migration — the #1660 incident (N parallel agents deriving
        # the same "next" version; the first PR's push wins the ledger row,
        # every sibling PR's push then corrupts it further / fails). DB-free
        # scripts/check-migration-collision.ts (Guards & Build) catches the
        # same-machine and branch-vs-committed-dev-tree cases; this is the
        # authoritative backstop for the residual race between two branches
        # that were never diffed against each other. Runs for both apps —
        # main and rag both use the shared supabase_migrations.schema_migrations
        # ledger convention. Each target skips gracefully if its DB URL secret
        # is absent (Dependabot / missing secret) — same posture as the
        # RLS/grants checks below. SUPABASE_DB_URL / SUPABASE_RAG_DB_URL come
        # from the job-level env above.
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
          MIGRATION_LEDGER_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          pnpm tsx scripts/check-migration-ledger.ts --target=main
          pnpm tsx scripts/check-migration-ledger.ts --target=rag

      - name: Reset main test DB before apply (#1660 / #1896)
        # Return the shared MAIN test DB to a clean slate so the push below
        # rebuilds every migration from scratch, regardless of what any
        # abandoned branch left in the shared ledger. This is what makes the
        # apply self-contained (the precondition for a safe merge queue) and is
        # a strict improvement today: it kills the orphan-ledger-row wedge from
        # docs/runbooks/migrations.md §4. Runs AFTER the ledger collision
        # pre-check above (which reads the live pre-reset ledger) and BEFORE the
        # push. Guarded by URL presence + CONFIRM_TEST_DB_RESET, so a
        # secret-less run (Dependabot) skips gracefully.
        env:
          CONFIRM_TEST_DB_RESET: "true"
          # Distinctly-named target var (#1896 audit): the reset script reads
          # RESET_TARGET_DB_URL, never the generic SUPABASE_DB_URL, so this
          # destructive step can only ever be pointed at the test DB — never the
          # prod DB that SUPABASE_DB_URL binds to in prod-drift-check.yml.
          RESET_TARGET_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: pnpm db:reset:ci

      - name: Apply main app migrations to test DB
        # Brings TEST DB to HEAD before the snapshot check so that a PR which
        # includes a migration + updated snapshot can validate both in one run,
        # eliminating the need for a follow-up snapshot PR after the nightly apply.
        # Guarded by URL presence — Dependabot and other secret-less runs skip
        # gracefully; the rls:check step below handles the empty-URL case via
        # RLS_ALLOW_NO_TARGETS.
        working-directory: apps/main
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set — skipping migration apply (Dependabot or missing secret)"
            exit 0
          fi
          npx supabase db push --include-all --db-url "$SUPABASE_DB_URL"

      - name: Reset RAG test DB before apply (#1914)
        env:
          CONFIRM_TEST_DB_RESET: "true"
          RESET_TARGET_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
        run: pnpm db:reset:ci -- --target=rag

      - name: Apply RAG app migrations to test DB
        working-directory: apps/rag
        run: |
          if [ -z "$SUPABASE_RAG_DB_URL" ]; then
            echo "SUPABASE_RAG_DB_URL not set — skipping migration apply (Dependabot or missing secret)"
            exit 0
          fi
          npx supabase db push --include-all --db-url "$SUPABASE_RAG_DB_URL"

      - name: Check RLS drift (fail on PR, release/*, merge_group, and manual dispatch)
        # merge_group included so the queue actually verifies drift — without it
        # this step skips on a queue build and the required RLS Snapshot Diff
        # check would pass green without ever comparing the snapshot (#1896).
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          # Dependabot-triggered runs don't receive repo secrets, so the
          # DB URLs above are empty and no target can be checked. Allow the
          # no-targets case to pass ONLY for Dependabot (dependency bumps
          # never touch RLS). Human/same-repo PRs do get the secrets, so an
          # absent target there is still a real failure.
          # `dependabot[bot]` is a reserved GitHub App identity on
          # pull_request events — it can't be spoofed by a contributor.
          RLS_ALLOW_NO_TARGETS: ${{ github.actor == 'dependabot[bot]' }}
        run: pnpm rls:check

      - name: Report snapshot/grants drift on dev (open tracking issue)
        # Post-merge backstop (#1492 part 2). Every PR is gated by the
        # rls-snapshot-diff / grants checks above plus the check:policy-snapshot
        # guard, but a drift that bypassed them (e.g. a secret-less run that
        # skipped the migration apply) would otherwise only emit a log warning.
        # Open — or reuse — a single `snapshot-drift` issue so it's actionable.
        # Runs both checks here so the grants dev-push warn step is no longer
        # needed. Alerting failure never fails the dev build (drift already found).
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          drift=""
          pnpm rls:check    || drift="${drift}- RLS snapshot drift — run \`pnpm rls:snapshot\` and commit db/rls-snapshot-{main,rag}.sql"$'\n'
          pnpm grants:check || drift="${drift}- Grants drift — run \`pnpm grants:snapshot\` and commit db/grants-snapshot-{main,rag}.sql"$'\n'
          if [ -z "$drift" ]; then echo "No snapshot/grants drift on dev."; exit 0; fi
          echo "::warning::Snapshot/grants drift on dev — see the 'snapshot-drift' tracking issue."
          existing=$(gh issue list --state open --label snapshot-drift --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            echo "Drift issue already open: #$existing — leaving it as the single tracker."
            exit 0
          fi
          body=$(printf 'Snapshot/grants drift detected on `dev` after merge by the deploy.yml post-merge backstop. PR checks (rls-snapshot-diff / grants-diff plus the check:policy-snapshot guard) normally catch this; a drift reaching here bypassed them (e.g. a secret-less run that skipped the migration apply).\n\nDetected:\n%s\nCommit: %s\nRun: %s/%s/actions/runs/%s\n\nFix: regenerate the snapshot(s) (`pnpm rls:snapshot` / `pnpm grants:snapshot`), commit, and close this issue.' "$drift" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue create --title "Snapshot drift on dev (auto-detected)" --label snapshot-drift --body "$body" \
            || echo "::warning::could not open drift issue — check the job's issues:write permission"

      # Grant-drift (#546). The RLS snapshot above captures rowsecurity + policies
      # but NOT table GRANTs, so a table shipped without its service_role grant
      # (the #544 prod outage) produced no diff. This step diffs live GRANTs
      # against the committed baseline (db/grants-snapshot-{main,rag}.sql).
      #
      # PR and release/* both check against the TEST DBs (same target as the RLS
      # check above). The dedicated test DB derives its grants from the migrations'
      # per-table GRANTs — db:reset recreates the public schema (wiping Supabase's
      # default ACLs) and the migrations restore grants — so the committed baseline
      # matches it with no false drift (verified empirically), AND it still catches
      # the #544 class: a table shipped without its grant shows as missing on the
      # migration-built DB. Regenerate the baseline from the TEST DB: `pnpm grants:snapshot`.
      #
      # Out-of-band PROD grant/RLS drift is caught by .github/workflows/prod-drift-check.yml
      # (nightly, read-only), decoupled from releases AND STAGING_PIPELINE_ENABLED.
      # The old pre-migration prod gate here was REMOVED: it compared prod BEFORE the
      # release's own migrations applied (deploy-production is downstream), so it
      # false-failed every new-table release. See #1349 for the prod migration-apply path.
      - name: Check grants drift (fail on PR, release/*, merge_group, and manual dispatch — vs test DB)
        # merge_group included for the same reason as the RLS drift step above:
        # the queue must verify grants drift, not skip it (#1896).
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
          # Dependabot runs don't receive secrets (empty URLs → no targets);
          # allow that case to pass only for Dependabot, as with RLS above.
          GRANTS_ALLOW_NO_TARGETS: ${{ github.actor == 'dependabot[bot]' }}
        run: pnpm grants:check

      # Grants drift on dev push is now reported by the consolidated
      # "Report snapshot/grants drift on dev" step above (it runs grants:check too).

      - name: Require the critical isolation test databases
        id: isolation-db-preflight
        env:
          # Use the PR author, not github.actor: a human can rerun a Dependabot
          # PR, but GitHub still withholds repository secrets from that PR.
          ISOLATION_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: pnpm tsx scripts/check-critical-rag-db.ts

      - name: Classify cross-tenant probe inputs
        id: cross-tenant-preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$APP_BASE_URL" ] && [ "$CROSS_TENANT_FIXTURES" = "true" ]; then
            echo "cross_tenant_mode=live" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ "$CROSS_TENANT_FIXTURES" = "true" ] && [ -z "$APP_BASE_URL" ]; then
            echo "cross_tenant_mode=host-unavailable" >> "$GITHUB_OUTPUT"
            echo "No compatible APP_BASE_URL is configured; route enumeration will run, but no live cross-tenant acceptance is claimed."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "cross_tenant_mode=dependabot-exempt" >> "$GITHUB_OUTPUT"
            echo "Dependabot pull request has no live cross-tenant credentials; retaining the explicit secret-less exemption."
            exit 0
          fi
          echo "::error::Cross-tenant enumeration requires NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and CROSS_TENANT_FIXTURES=true; live requests additionally require APP_BASE_URL."
          exit 1

      - name: Run main RLS integration suite
        if: steps.isolation-db-preflight.outputs.run_main_rls == 'true'
        env:
          MAIN_RLS_DB_REQUIRED: "true"
        run: pnpm vitest run apps/main/test/integration/rls.test.ts

      - name: Run Stripe-webhook integration suite
        run: pnpm vitest run apps/main/test/integration/stripe-webhook.test.ts

      - name: Run seeded RAG scope integration suite
        if: steps.isolation-db-preflight.outputs.run_rag_scope == 'true'
        env:
          RAG_SCOPE_DB_REQUIRED: "true"
        run: pnpm -C apps/rag exec vitest run test/integration/retrieval-scope-isolation.test.ts

      - name: Run ledger routine-identity PostgreSQL fixtures
        run: pnpm vitest run tests/integration/scripts/check-ledger-objects-db.test.ts

      - name: Run cross-tenant probe
        run: pnpm test:cross-tenant

      - name: Record revision provenance
        id: revision-provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MAIN_MODE: ${{ steps.isolation-db-preflight.outputs.run_main_rls }}
          RAG_MODE: ${{ steps.isolation-db-preflight.outputs.run_rag_scope }}
          CROSS_TENANT_MODE: ${{ steps.cross-tenant-preflight.outputs.cross_tenant_mode }}
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Revision provenance mismatch: checkout=$checked_out_sha event=$GITHUB_SHA"
            exit 1
          fi
          if [ "$MAIN_MODE" = "true" ] && [ "$RAG_MODE" = "true" ] && [ "$CROSS_TENANT_MODE" = "live" ]; then
            echo "acceptance_mode=db-probe-live-host-unverified" >> "$GITHUB_OUTPUT"
          elif [ "$MAIN_MODE" = "true" ] && [ "$RAG_MODE" = "true" ] && [ "$CROSS_TENANT_MODE" = "host-unavailable" ]; then
            echo "acceptance_mode=db-probe-host-unavailable" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$CROSS_TENANT_MODE" = "dependabot-exempt" ]; then
            echo "acceptance_mode=dependabot-exempt" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Required acceptance modes were not established: main=$MAIN_MODE rag=$RAG_MODE cross_tenant=$CROSS_TENANT_MODE"
            exit 1
          fi
          echo "db_probe_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  integration-tests-critical:
    name: Integration Tests (RLS + RAG Scope + Payments)
    runs-on: ubuntu-latest
    # Required-context receipt. The evidence-bearing suites run inside
    # rls-snapshot-diff's uninterrupted holder; this job fails if that holder
    # does not attest the exact event SHA.
    needs: [detect-changes, rls-snapshot-diff]
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
        ((github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') &&
          needs.detect-changes.outputs.workflows_only != 'true'))
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      DETECT_RESULT: ${{ needs.detect-changes.result }}
      HOLDER_RESULT: ${{ needs.rls-snapshot-diff.result }}
      EXPECTED_SHA: ${{ github.sha }}
      DB_PROBE_SHA: ${{ needs.rls-snapshot-diff.outputs.db_probe_sha }}
      ACCEPTANCE_MODE: ${{ needs.rls-snapshot-diff.outputs.acceptance_mode }}
    steps:
      - name: Verify exact tested revision
        run: |
          if [ "$DETECT_RESULT" != "success" ] || [ "$HOLDER_RESULT" != "success" ]; then
            echo "::error::Required dependency failed or was cancelled: detect=$DETECT_RESULT holder=$HOLDER_RESULT"
            exit 1
          fi
          if [ -z "$DB_PROBE_SHA" ] || [ "$DB_PROBE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::DB/probe revision provenance missing or stale: expected=$EXPECTED_SHA verified=${DB_PROBE_SHA:-missing}"
            exit 1
          fi
          if [ "$ACCEPTANCE_MODE" = "db-probe-live-host-unverified" ]; then
            echo "Revision-bound main/RAG DB integration acceptance passed for $DB_PROBE_SHA."
          elif [ "$ACCEPTANCE_MODE" = "db-probe-host-unavailable" ]; then
            echo "Revision-bound main/RAG DB integration acceptance passed for $DB_PROBE_SHA; route enumeration ran, but no live cross-tenant acceptance is claimed."
          elif [ "$ACCEPTANCE_MODE" = "dependabot-exempt" ] && [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot secret-less exemption recorded for $DB_PROBE_SHA; no live integration acceptance is claimed."
          else
            echo "::error::Unexpected acceptance mode: ${ACCEPTANCE_MODE:-missing}"
            exit 1
          fi

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, typecheck, lint]
    if: (github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') && needs.detect-changes.outputs.workflows_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests (MSW replay)
        run: pnpm test:contracts

  cross-tenant-probe:
    name: Cross-Tenant Probe
    runs-on: ubuntu-latest
    # Required-context receipt for the probe executed inside the uninterrupted
    # shared-DB holder. Keep the non-DB CI dependencies that historically gate
    # this status, and fail if the holder did not test this exact event SHA.
    needs: [detect-changes, typecheck, lint, test, secret-scan, rls-snapshot-diff]
    if: |
      always() &&
      (needs.detect-changes.result != 'success' ||
        ((github.event_name != 'pull_request' || needs.detect-changes.outputs.code == 'true') &&
          needs.detect-changes.outputs.workflows_only != 'true'))
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      DETECT_RESULT: ${{ needs.detect-changes.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      HOLDER_RESULT: ${{ needs.rls-snapshot-diff.result }}
      EXPECTED_SHA: ${{ github.sha }}
      DB_PROBE_SHA: ${{ needs.rls-snapshot-diff.outputs.db_probe_sha }}
      ACCEPTANCE_MODE: ${{ needs.rls-snapshot-diff.outputs.acceptance_mode }}
    steps:
      - name: Verify exact tested revision
        run: |
          for result in "$DETECT_RESULT" "$TYPECHECK_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$SECRET_SCAN_RESULT" "$HOLDER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required dependency failed, was skipped, or was cancelled: detect=$DETECT_RESULT typecheck=$TYPECHECK_RESULT lint=$LINT_RESULT test=$TEST_RESULT secret_scan=$SECRET_SCAN_RESULT holder=$HOLDER_RESULT"
              exit 1
            fi
          done
          if [ -z "$DB_PROBE_SHA" ] || [ "$DB_PROBE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::DB/probe revision provenance missing or stale: expected=$EXPECTED_SHA verified=${DB_PROBE_SHA:-missing}"
            exit 1
          fi
          if [ "$ACCEPTANCE_MODE" = "db-probe-live-host-unverified" ]; then
            echo "Cross-tenant probe code and main/RAG test-DB state were revision-bound to $DB_PROBE_SHA; live requests ran against APP_BASE_URL, whose hosted app revision was not verified."
          elif [ "$ACCEPTANCE_MODE" = "db-probe-host-unavailable" ]; then
            echo "Cross-tenant route enumeration ran at revision $DB_PROBE_SHA; no compatible APP_BASE_URL was configured, so no live cross-tenant acceptance is claimed."
          elif [ "$ACCEPTANCE_MODE" = "dependabot-exempt" ] && [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot secret-less exemption recorded for $DB_PROBE_SHA; no live cross-tenant acceptance is claimed."
          else
            echo "::error::Unexpected acceptance mode: ${ACCEPTANCE_MODE:-missing}"
            exit 1
          fi

  # ============================================================
  # atc-rag beta deploy (#1829) — runs on dev-merge only, gated by
  # detect-changes' rag_changed filter so an atc-main-only PR merge
  # doesn't trigger a redundant RAG deploy. Runs Vercel from the repository
  # root because the hosted atc-rag project already sets Root Directory to
  # `apps/rag`; changing the process directory as well would resolve the
  # nonexistent doubled path `apps/rag/apps/rag`. This keeps the project's
  # remote-build path and needs no local Node/pnpm install step.
  #
  # atc-main itself has NO equivalent explicit beta-deploy job in this
  # file — Vercel's native Git integration deploys atc-main on every
  # push to `dev` automatically. atc-rag's Git integration does not
  # (confirmed by the manual-deploy-only status quo this issue fixes),
  # so this job is the explicit substitute for that missing integration
  # wiring, scoped by path so it only fires when relevant.
  # ============================================================

  deploy-rag-beta:
    name: Deploy atc-rag (Beta)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.detect-changes.outputs.rag_changed == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_RAG_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install -g vercel@54

      - name: Vercel deploy (atc-rag beta)
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_RAG_PROJECT_ID secret is not set — see #1829 first-run notes in the PR body. Aborting."
            exit 1
          fi
          vercel deploy --token="$VERCEL_TOKEN" --yes --build-env ENABLE_EXPERIMENTAL_COREPACK=1

  # ============================================================
  # db-copy block — production → staging clone (job 5)
  # Runs only on push to release/* branches
  # ============================================================

  db-copy:
    name: Copy Prod DB to Staging
    runs-on: ubuntu-latest
    # Skipped until staging DB is provisioned. Set STAGING_PIPELINE_ENABLED=true
    # repo variable to activate. See issue #533.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/release/') && vars.STAGING_PIPELINE_ENABLED == 'true'
    concurrency:
      group: shared-test-db
      cancel-in-progress: false
    outputs:
      staged_sha: ${{ steps.staging-provenance.outputs.staged_sha }}
    needs:
      [
        typecheck,
        lint,
        test,
        secret-scan,
        cve-scan,
        rls-snapshot-diff,
        cross-tenant-probe,
        contract-tests,
      ]
    environment: staging
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      DB_URL: ${{ secrets.DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEST_OVERRIDE_EMAIL: ${{ secrets.TEST_OVERRIDE_EMAIL }}
      TEST_OVERRIDE_PHONE: ${{ secrets.TEST_OVERRIDE_PHONE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Supabase prod is on Postgres 17; Ubuntu's default postgresql-client is
      # 16, and pg_dump refuses to dump a server newer than itself ("server
      # version mismatch"). Install the v17 client from the PGDG apt repo and
      # prepend its bin to PATH so pg_dump/pg_restore/psql below all use 17.
      # Bump this when Supabase upgrades the prod major again.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump production database (public schema only)
        run: |
          # Only the application schema. The Supabase-managed schemas (auth,
          # storage, graphql, realtime, vault) are owned by supabase_admin and
          # CANNOT be restored by the postgres role — a full dump produced 500+
          # "permission denied"/"must be owner" errors. Staging is its own
          # Supabase project and already has those schemas natively.
          # Keep ACLs (no --no-acl): the dump carries prod's real per-table
          # grants, which are the SAME source of truth as db/grants-snapshot-main.sql
          # (verified: a with-ACL restore shows "no drift" against the snapshot).
          # This auto-syncs grants from prod — no hand-maintained grants script to
          # drift. --no-owner still strips ownership (objects restore as postgres).
          pg_dump "$PROD_DB_URL" \
            --schema=public \
            --no-owner \
            --format=custom \
            --file=prod_dump.pgdump

      - name: Reset staging public schema and restore
        run: |
          # 1) Evict app connections so the schema reset isn't blocked by locks.
          #    Scope to NON-superuser client backends only: Supabase's postgres
          #    role isn't a true superuser and can't terminate superuser/system
          #    backends ("permission denied to terminate process").
          psql "$DB_URL" -c "SELECT pg_terminate_backend(sa.pid) FROM pg_stat_activity sa JOIN pg_roles r ON r.rolname = sa.usename WHERE sa.datname = current_database() AND sa.pid <> pg_backend_pid() AND sa.backend_type = 'client backend' AND NOT r.rolsuper;"

          # 2) Reset public to an empty schema, then restore into it. We do NOT
          #    use pg_restore --clean: on a populated Supabase DB it drops objects
          #    out of dependency order and yields ~100 "no unique constraint" /
          #    "cannot drop ... depends on" errors. Restoring into an empty schema
          #    is clean. The dump recreates `public` itself (CREATE SCHEMA).
          #    NOTE: CASCADE also drops the few Supabase-managed objects that
          #    depend on public (e.g. storage RLS policies, realtime publication
          #    membership); the postgres role can't recreate those, so staging
          #    loses them — an accepted limitation tracked separately.
          psql "$DB_URL" -c "DROP SCHEMA IF EXISTS public CASCADE;"

          # 3) Restore (no --clean; schema is empty). Data loads first, then
          #    constraints and grants. pg_restore exits non-zero on a few error
          #    classes that are inherent to a Supabase postgres-role restore and
          #    are safe to ignore:
          #      - public->auth.users FK constraints — can't validate because the
          #        Supabase-managed auth schema isn't copied; the row DATA still
          #        loads, only the (unenforceable) FK is skipped.
          #      - "permission denied to change default privileges" — the dump's
          #        ALTER DEFAULT PRIVILEGES can't run as postgres on Supabase; this
          #        only affects FUTURE objects (none are created on staging between
          #        refreshes), and the actual table grants DO restore (verified
          #        "no drift" vs the committed grants snapshot).
          #      - benign "schema public already exists".
          #    Any OTHER error fails the job — a real restore failure can't slip by.
          set +e
          pg_restore --no-owner --dbname="$DB_URL" prod_dump.pgdump 2> restore_err.log
          restore_rc=$?
          set -e
          unexpected=$(grep -E '^pg_restore: error:' restore_err.log 2>/dev/null \
            | grep -vE 'foreign key constraint "[^"]*auth_user_id[^"]*fkey"' \
            | grep -vE 'permission denied to change default privileges' \
            | grep -vE 'schema "public" already exists' \
            | wc -l | tr -d ' ')
          if [ "${unexpected:-0}" -gt 0 ]; then
            echo "::error::pg_restore reported ${unexpected} unexpected error(s) (not the known Supabase auth-FK / default-privileges / schema-exists classes):"
            cat restore_err.log
            exit 1
          fi
          # Belt-and-suspenders: the gate above is text-based. A non-zero exit with
          # NO "pg_restore: error:" lines at all (e.g. OOM / SIGKILL / aborted before
          # logging) must NOT pass silently — fail on an unexplained non-zero rc.
          total_err=$(grep -cE '^pg_restore: error:' restore_err.log 2>/dev/null || true)
          if [ "${restore_rc}" -ne 0 ] && [ "${total_err:-0}" -eq 0 ]; then
            echo "::error::pg_restore exited ${restore_rc} with no recognizable error lines — treating as failure."
            cat restore_err.log
            exit 1
          fi
          tolerated=$(grep -cE 'foreign key constraint "[^"]*auth_user_id[^"]*fkey"' restore_err.log 2>/dev/null || true)
          echo "::notice::Staging restore OK (pg_restore rc=${restore_rc}); tolerated ${tolerated:-0} auth-FK constraint(s) + Supabase default-privilege noise. Table grants restored from prod (matches grants snapshot)."

      - name: Apply staging fixups
        env:
          # PGOPTIONS sets a dot-qualified custom GUC on the connection so the
          # SQL can read it via current_setting('e2e_email.val', true).
          # psql -v uses client-side text substitution (a different namespace)
          # and does NOT populate GUC — PGOPTIONS is the correct mechanism.
          PGOPTIONS: "-c e2e_email.val=${{ secrets.TEST_E2E_OWNER_EMAIL }}"
        run: |
          psql "$DB_URL" -f scripts/staging-fixups.sql

      # #1316 — DROP SCHEMA public CASCADE (above) drops storage RLS policies
      # that reference public functions, and `supabase db push` won't recreate
      # them (they're already in the migration ledger). Re-apply them here.
      # Fails the job on error: these run as postgres exactly as the owning
      # migrations do, so a failure is a real regression, not a privilege gap.
      - name: Restore storage RLS policies (#1316)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/restore-staging-policies.sql

      # #1316 — Realtime publication membership. `DROP TABLE` removed public
      # tables from the supabase_realtime publication. There is no source of
      # truth for the membership in the repo (the app defines no realtime
      # subscriptions and no migration manages the publication), so we CAPTURE
      # the live membership from prod and REPLAY it onto staging rather than
      # hard-code a guessed table list. The generated SQL is idempotent.
      - name: Capture prod realtime publication membership (#1316)
        run: |
          set -euo pipefail
          # Emit one idempotent DO-block per public table currently in the
          # supabase_realtime publication on prod. string_agg → NULL (empty
          # file) when prod has no public members, making replay a clean no-op.
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -tA -o realtime-publication-restore.sql -c "
            SELECT COALESCE(string_agg(
              format(
                'DO \$do\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_publication_tables WHERE pubname=''supabase_realtime'' AND schemaname=''public'' AND tablename=%L) THEN ALTER PUBLICATION supabase_realtime ADD TABLE public.%I; END IF; END \$do\$;',
                tablename, tablename
              ),
              E'\n'
            ), '')
            FROM pg_publication_tables
            WHERE pubname = 'supabase_realtime' AND schemaname = 'public';
          "
          echo '::notice::Captured realtime membership from prod:'
          cat realtime-publication-restore.sql

      - name: Replay realtime publication membership onto staging (#1316)
        run: |
          set -euo pipefail
          if [ ! -s realtime-publication-restore.sql ]; then
            echo '::notice::No prod realtime public-table membership to restore — skipping.'
            exit 0
          fi
          # Tolerant, not fail-closed: supabase_realtime is owned by
          # supabase_admin, and the postgres role may lack ALTER PUBLICATION on
          # it. A permission failure here is the known #1316 limitation, not a
          # broken refresh — warn loudly (operator restores via service role)
          # and let the pipeline continue. Any OTHER error still surfaces.
          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f realtime-publication-restore.sql 2> realtime_err.log
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qiE 'must be owner|permission denied' realtime_err.log; then
              echo "::warning::postgres role cannot ALTER PUBLICATION supabase_realtime (owned by supabase_admin). Restore realtime membership via service role. See #1316."
              cat realtime_err.log
            else
              echo "::error::Unexpected error replaying realtime publication membership:"
              cat realtime_err.log
              exit 1
            fi
          else
            echo '::notice::Realtime publication membership restored onto staging.'
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations
        working-directory: apps/main
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::DB_URL secret is not set in the 'staging' GitHub environment. Aborting."
            exit 1
          fi
          npx supabase db push --include-all --db-url "$DB_URL"

      - name: Migration drift check (#1158)
        # Fails if the migration ledger diverges from what the DB reports after
        # push — catches silent push failures and out-of-band dashboard changes.
        run: pnpm tsx scripts/check-schema-drift.ts --target=main --db-url "$DB_URL"

      - name: Vercel deploy (preview)
        run: |
          vercel pull --environment=preview --yes --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN

      - name: Run Playwright E2E tests
        # This step is the pre-prod-promotion gate. It runs the full tests/e2e
        # suite against the real staging subdomain, which is where the
        # onboarding-funnel smoke spec (#1159, tests/e2e/onboarding-funnel.spec.ts)
        # activates: it needs BASE_URL (a real subdomain) + TEST_E2E_OWNER_EMAIL/
        # PASSWORD, all set below. When the #1286 secrets are absent the funnel
        # spec skips loudly rather than failing (see its describe gate).
        env:
          BASE_URL: https://staging.ai-travelconcierge.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          TEST_E2E_OWNER_EMAIL: ${{ secrets.TEST_E2E_OWNER_EMAIL }}
          TEST_E2E_OWNER_PASSWORD: ${{ secrets.TEST_E2E_OWNER_PASSWORD }}
        run: |
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Smoke test staging
        id: staging-health
        run: |
          sleep 20
          health_response=$(curl -f --silent --show-error https://staging.ai-travelconcierge.com/api/health)
          echo "$health_response"
          health_commit=$(printf '%s' "$health_response" | node -e 'const fs = require("fs"); const health = JSON.parse(fs.readFileSync(0, "utf8")); if (health.status !== "ok" || health.service !== "main" || typeof health.commit !== "string") process.exit(1); process.stdout.write(health.commit.trim());')
          if [ -z "$health_commit" ] || [ "$health_commit" = "unknown" ]; then
            echo "::error::Staging health response did not identify a concrete deployed commit."
            exit 1
          fi
          echo "commit=$health_commit" >> "$GITHUB_OUTPUT"

      - name: Record staging revision provenance
        id: staging-provenance
        env:
          HEALTH_COMMIT: ${{ steps.staging-health.outputs.commit }}
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Staging revision provenance mismatch: checkout=$checked_out_sha event=$GITHUB_SHA"
            exit 1
          fi
          if [ -z "$HEALTH_COMMIT" ] || [ "$HEALTH_COMMIT" = "unknown" ] || [ "$HEALTH_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Staging hosted revision mismatch: event=$GITHUB_SHA hosted=${HEALTH_COMMIT:-missing}"
            exit 1
          fi
          echo "staged_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Staging receipt — preserves the required status name (job 6)
  # The shared-DB holder above performs the deployment and live checks.
  # ============================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/release/') &&
      vars.STAGING_PIPELINE_ENABLED == 'true'
    needs: [db-copy]
    env:
      HOLDER_RESULT: ${{ needs.db-copy.result }}
      EXPECTED_SHA: ${{ github.sha }}
      STAGED_SHA: ${{ needs.db-copy.outputs.staged_sha }}
    steps:
      - name: Verify exact staged revision
        run: |
          if [ "$HOLDER_RESULT" != "success" ]; then
            echo "::error::Staging holder failed, was skipped, or was cancelled: holder=$HOLDER_RESULT"
            exit 1
          fi
          if [ -z "$STAGED_SHA" ] || [ "$STAGED_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Staging deployment provenance missing or stale: expected=$EXPECTED_SHA staged=${STAGED_SHA:-missing}"
            exit 1
          fi
          echo "Staging deployment and acceptance passed for $STAGED_SHA."

  # ============================================================
  # Production block — deploy + smoke + tag + auto-merge (job 7)
  # Runs only on push to release/* branches
  # ============================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # #1349 — prod migration-apply + deploy depends DIRECTLY on the CI gates, not
    # only on deploy-staging. deploy-staging/db-copy are gated by
    # STAGING_PIPELINE_ENABLED (false today, #533); when that's off they're SKIPPED,
    # so listing deploy-staging as the sole `needs` made prod-apply rely on a skipped
    # job's status propagating up the transitive chain (db-copy → CI jobs). That's
    # fragile and implicit: it false-blocked prod whenever ANY ancestor CI gate failed
    # — the exact failure that forced the manual raw-psql apply behind the D-285 ledger
    # desync. Listing every required CI gate as a direct `needs` makes the intent
    # explicit: failure() blocks prod iff a gate ACTUALLY failed. deploy-staging stays
    # in `needs` as an OPTIONAL pre-prod layer — skipped (disabled) doesn't block,
    # failed (enabled) does, via !failure(). The `production` GitHub environment's
    # required-reviewer gate remains the per-instance operator approval; no prod
    # migration or deploy happens without it.
    #
    # #1851 audit finding 3 — integration-tests-critical (#1797, RLS + Stripe-
    # webhook suites) was added as a CI gate but not listed here, so this job's
    # own every-gate-is-a-direct-needs convention above didn't actually cover
    # it: a failing RLS/payments regression wouldn't block prod. Added below.
    # Not yet promoted to dev's branch-protection required-status-checks list
    # (#1797's own deferral, unresolved) — that promotion is still the
    # operator's morning action once the job has a few clean runs on `dev`.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/release/') &&
      !failure() && !cancelled()
    needs:
      [
        typecheck,
        lint,
        test,
        secret-scan,
        cve-scan,
        rls-snapshot-diff,
        integration-tests-critical,
        cross-tenant-probe,
        contract-tests,
        deploy-staging,
      ]
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: production
      url: https://ai-travelconcierge.com
    env:
      DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations to production
        working-directory: apps/main
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::DB_URL secret is not set in the 'production' GitHub environment. Aborting."
            exit 1
          fi
          npx supabase db push --include-all --db-url "$DB_URL"

      - name: Migration drift check (#1158)
        # Fails if the migration ledger diverges from what the DB reports after
        # push — catches silent push failures and out-of-band dashboard changes.
        run: pnpm tsx scripts/check-schema-drift.ts --target=main --db-url "$DB_URL"

      # #851 — model canary gate. Refuses to ship a config that references a
      # retired/unavailable Anthropic model. Self-guards: skips (non-fatal) when
      # ANTHROPIC_API_KEY isn't provisioned in CI; once the secret exists it FAILS
      # the deploy on a bad model id, before the Vercel deploy below.
      - name: Verify configured models are live (#851)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm tsx scripts/check-models-live.ts

      - name: Install Vercel CLI
        run: npm install -g vercel@54

      - name: Vercel deploy (production)
        run: vercel deploy --target=production --yes --token=$VERCEL_TOKEN

      - name: Smoke test production
        run: |
          sleep 30
          curl -f https://ai-travelconcierge.com/api/health

      # #1829 — atc-rag prod deploy, through this SAME job and the SAME
      # `production` GitHub Environment approval gate as atc-main above (one
      # approval covers both; a separate job here would need its own
      # `environment: production` and force a second reviewer click).
      # Unconditional on every release, same as atc-main's own prod deploy
      # step has no change filter — this is a rare, deliberate event, not
      # the frequent dev-merge traffic the beta job's rag_changed filter
      # protects against. Uses the same remote-build `vercel deploy --prod`
      # command already verified working manually (memory:
      # reference_rag_deploy.md) rather than the pull/build/deploy-prebuilt
      # pattern atc-main uses above. Run from repository root because the
      # hosted project already contributes its configured `apps/rag` root.
      - name: Vercel deploy (atc-rag production)
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_RAG_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_RAG_PROJECT_ID secret is not set — see #1829 first-run notes in the PR body. Aborting (fails the deploy loudly rather than silently skipping RAG prod)."
            exit 1
          fi
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --build-env ENABLE_EXPERIMENTAL_COREPACK=1

      - name: Smoke test atc-rag production
        # Domain per apps/main/.env.example's RAG_SERVICE_URL / pentest-scoping.md
        # — not a secret, so no new secret needed for this check.
        run: |
          sleep 15
          curl -f https://rag.ai-travelconcierge.com/api/health

      - name: Sync Inngest app (#835)
        # Vercel CLI deploys don't fire the Vercel→Inngest integration, so a newly
        # ADDED Inngest function isn't registered (can't be triggered / won't run
        # on its cron) until someone manually resyncs the app. Sync via the Inngest
        # REST API (https://www.inngest.com/docs/apps/cloud) now that the new code
        # is live + smoke-tested. App id = the Inngest client id (`new Inngest({ id })`
        # in apps/main/src/inngest/client.ts). Requires the INNGEST_API_KEY repo
        # secret (Inngest dashboard → Settings → API keys). Non-fatal: a missing key
        # or a sync error warns but never blocks an already-live deploy — consistent
        # with the auto-merge-back step below.
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
        run: |
          if [ -z "$INNGEST_API_KEY" ]; then
            echo "::warning::INNGEST_API_KEY not set — skipping Inngest sync; new functions won't register until a manual resync (#835)."
            exit 0
          fi
          curl -fsS -X POST "https://api.inngest.com/v2/apps/atc-main/syncs" \
            -H "Authorization: Bearer $INNGEST_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"url": "https://ai-travelconcierge.com/api/inngest"}' \
            || echo "::warning::Inngest sync failed (#835) — verify INNGEST_API_KEY + app id 'atc-main', then resync manually in the Inngest dashboard."

      - name: Create release tag
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes \
            --target "$GITHUB_REF_NAME"

      - name: Auto-merge release branch back to dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CREATE_OUT=$(gh pr create \
            --base dev \
            --head "$GITHUB_REF_NAME" \
            --title "chore: merge $GITHUB_REF_NAME back to dev" \
            --label "release-merge" \
            --body "Automated post-release merge." 2>&1) || {
            if echo "$CREATE_OUT" | grep -q "No commits between"; then
              echo "Release branch already in sync with dev — nothing to merge back."
              exit 0
            fi
            echo "$CREATE_OUT"
            exit 1
          }
          echo "$CREATE_OUT"
          gh pr merge --merge --auto || { echo "Auto-merge failed or conflict — resolve manually. PR URL above."; exit 0; }
