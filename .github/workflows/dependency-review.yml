name: Dependency Review

# actions/dependency-review-action diffs the PR's dependency manifests/
# lockfiles against the base branch and fails when a newly introduced
# dependency has a known vulnerability at or above fail-on-severity.
# Adopted per #1896 (GitHub features audit, Part 2) to catch known-
# vulnerable deps at PR time — Dependabot alerts are post-merge only.
#
# No paths-ignore: the action itself no-ops when a PR doesn't touch a
# manifest/lockfile (nothing to diff), so doc-only PRs are unaffected
# without needing a filter — unlike CI/CodeQL, which run real work that
# doc-only PRs must skip.

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
