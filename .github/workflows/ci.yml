name: CI

on:
  pull_request:
    branches:
      - dev
      - "release/*"
  # merge_group so the required "Guards & Build" check runs on merge-queue
  # builds too — a required check with no merge_group trigger would block the
  # queue forever. Additive; the pull_request trigger is unchanged. (#1896.)
  merge_group:

jobs:
  # Doc-only detection (PR-only trigger, so base_ref is always set). Lets the
  # required "Guards & Build" job skip on PRs whose every changed path is a doc.
  # A skipped required job is reported as passing by branch protection, so doc
  # PRs stay mergeable without running the guard suite. NOT done via paths-ignore
  # because this job is a required check — a never-reported required check would
  # strand the PR.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      workflows_only: ${{ steps.f.outputs.workflows_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-doc changes
        id: f
        env:
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # On a non-PR event (merge_group), base_ref is empty and there's no PR
          # diff to scope against — the queue must run the full guard suite, so
          # short-circuit to code=true. Mirrors deploy.yml's detect-changes.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail SAFE: any uncertainty (fetch/diff error) => code=true => run the
          # full guard suite. code=false (skip) only on a CONFIRMED doc-only diff.
          # NOT set -e: a git failure must fall through to code=true, not abort the
          # job — an aborted/failed detect-changes would skip the dependent
          # required job, which branch protection treats as passing (fail-open).
          git fetch --no-tags origin "$BASE" || true
          if ! CHANGED=$(git diff --name-only "origin/$BASE...HEAD" 2>/dev/null); then
            echo "::warning::git diff failed — defaulting to code=true (run full CI)."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NONDOC=$(printf '%s\n' "$CHANGED" | grep -vE '(\.md$|^docs/|^specs/)' || true)
          if [ -z "$NONDOC" ]; then
            echo "::notice::Doc-only PR — Guards & Build will skip (reported as passing)."
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"
          NON_WORKFLOW=$(printf '%s\n' "$NONDOC" | grep -v '^\.github/workflows/' || true)
          if [ -z "$NON_WORKFLOW" ]; then
            echo "::notice::Workflow-only PR — app-code CI will skip (reported as passing)."
            echo "workflows_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Required check. Carries the guards that tsc/eslint can't express
  # (dropped/static column readers, ambiguous embeds, D-091 gates, permission
  # matrix, duplication) plus the only PR-time build. Lint/typecheck are NOT
  # repeated here — deploy.yml's required Lint + Typecheck jobs cover them.
  guards:
    name: Guards & Build
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.workflows_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the policy-snapshot guard can diff origin/<base>...HEAD.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint migrations
        run: pnpm lint:migrations

      - name: Policy-snapshot guard (#1492)
        # A migration with CREATE/ALTER/DROP POLICY must regenerate its
        # db/rls-snapshot-<app>.sql in the same PR. DB-free early-catch for the
        # #1486-class drift; the DB-based rls-snapshot-diff job is the backstop.
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
          POLICY_SNAPSHOT_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          pnpm check:policy-snapshot

      - name: Migration-collision guard (#1660/#1661)
        # DB-free early-catch for parallel-agent version collisions: two
        # migration files sharing a version in the same app's migrations dir,
        # or a branch-added migration whose version already exists on dev
        # under a different filename. The rls-snapshot-diff job's DB-based
        # ledger pre-check (deploy.yml) is the authoritative backstop for the
        # residual cross-machine race this can't see.
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
          MIGRATION_COLLISION_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          pnpm check:migration-collision

      - name: Memory-decision collision guard (#1661)
        # Fails a PR that adds a `## D-NNN` header to MEMORY.md already
        # claimed by a sibling PR merged to dev (the D-318 double-claim
        # incident, #1652 vs #1643), and checks MEMORY.md/MEMORY-INDEX.md
        # header-set consistency. This is the only layer that observes a raw
        # merge-conflict resolution — the append-only PreToolUse hook only
        # covers Edit/Write tool calls, not a rebase's filesystem writes.
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
          MEMORY_COLLISION_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          pnpm check:memory-decision-collision

      - name: Dropped-column reader guard (BP38/#137)
        run: pnpm check:dropped-columns

      - name: Static-column reader guard (#1160)
        # Fails any PR where a .select() string names a column absent from that
        # table's live schema (determined by parsing CREATE TABLE + ALTER TABLE ops
        # from all migrations). Root cause of #1183 (tenants.tier, which doesn't
        # exist; tenant tier is stored as tier_id FK). tsc cannot catch this class.
        # Pre-existing violations baselined in db/column-reader-exceptions.txt (#1190).
        run: pnpm check:column-readers

      - name: Ambiguous PostgREST embed guard (#1157)
        # Fails when a .from("t").select("ref_table(cols)") embed is ambiguous
        # because t has 2+ FK paths to ref_table and no !constraint_name hint
        # is present. !inner and !left are join-type modifiers, not FK hints.
        run: pnpm check:ambiguous-embeds

      - name: Duplication guard (jscpd)
        run: pnpm check:duplication

      - name: Server-only poison-pill guard (#1524)
        # Fails when a server-exclusive importable lib module (reads a secret env
        # or uses the service-role client) lacks `import 'server-only'`. Without
        # the poison-pill, a future Client Component that transitively imports it
        # would bundle the secret/service-role reference into the browser with no
        # error. The package turns that into a build error instead.
        run: pnpm check:server-only

      - name: D-091 anti-pattern gates (#815)
        # Deterministic backstops for the recurring D-091 anti-patterns the
        # probabilistic d091-reviewer subagent has missed. Fails on NEW hits;
        # existing debt is baselined in scripts/d091-baseline.txt.
        run: pnpm check:d091

      - name: Permission-matrix guard (#1176)
        # Fails any PR where a route calls assertPermission with a (resource, action)
        # pair absent from permission-grants.ts. Root cause of #1173 and its instances.
        # tsc cannot catch this class (resource/action are plain strings); E2E tests
        # bypass it via role='tenant_owner'. Only this static sweep catches it.
        run: pnpm check:permission-matrix

      - name: Admin-route auth guard (#1393/G5)
        # Fails if any apps/*/src/app/api/admin/**/route.ts lacks an in-handler
        # platform-admin assertion. proxy.ts's admin gate is only a cookie shape
        # check; real authority is per-route. tsc cannot see this gap (root cause
        # of F-auth-02 / F-rag-auth-02 in the Day-1 scan).
        run: pnpm check:admin-auth

      - name: Error-message-egress guard (#1393/G1)
        # Fails on NEW raw DB error.message/.details echoed into an API response
        # (schema disclosure). Pre-existing sites frozen in the baseline; route
        # new ones through dbErrorResponse. Root cause of F-leak-01/02/03.
        run: pnpm check:error-egress

      - name: Unbounded-select guard (#1613 / D-091 #25)
        # Fails on a NEW .select() on a user-growing table (messages, quotes,
        # forum_*, email_log, …) with no .limit()/.range() — PostgREST silently
        # truncates at its default cap and returns a partial result with no
        # error. Presence check; pre-existing sites frozen in the baseline.
        run: pnpm check:unbounded-select

      - name: Serial-await-in-loop guard (#1789/#1951/#1985)
        # Fails on a NEW loop that awaits once per iteration in a background-job
        # directory (apps/*/src/inngest/**, apps/*/src/lib/cron/**) — the N+1
        # serial-await pattern that bounded Promise.all / mapWithConcurrency
        # fan-out fixes when iterations are independent. Presence check;
        # pre-existing un-annotated sites frozen in the baseline. Suppress a
        # genuinely-serial loop with `serial-await-ok: <reason>` instead of
        # adding to the baseline.
        run: pnpm check:serial-await

      - name: RLS policy-semantics guard (Harvey Tier-1, refs #2006)
        # Static semantic review of committed migration SQL: USING(true)/wrong-
        # column policies, SECURITY DEFINER writes/read-oracles with no caller
        # check (D-091 #27), and bare auth.*/current_setting() initplan misses.
        # Review-tier; pre-existing findings frozen in the baseline.
        run: pnpm check:rls-policy-semantics

      - name: Extension-manifest guard (Harvey Tier-1, refs #2000)
        # Fails on a NEW broad-host + sensitive-capability combo in any
        # apps/**/manifest.json (broad hosts + cookies reads every site's
        # session). The pre-#2015 apps/extension combo is baselined until that
        # PR merges.
        run: pnpm check:extension-manifest

      - name: Mocked-tenant-test guard (Harvey Tier-1, refs #2028)
        # Fails on a NEW test that claims tenant-isolation/RLS coverage by name
        # while its file mocks the Supabase client — the mock makes the claimed
        # coverage structurally impossible. Existing sites frozen in the baseline.
        run: pnpm check:mocked-tenant-tests

      - name: App Router boundary guard (Harvey Tier-1, M9)
        # AST checks: raw DB rows passed whole into 'use client' components
        # (RSC payload leak) and secret-reading modules reachable from client
        # code without `import "server-only"`.
        run: pnpm check:app-router-boundaries

      - name: PII-column classification guard (Harvey Tier-1, refs #2011)
        # Static schema parse (never a live DB): a NEW column matching the
        # PII/PHI/PCI/SECRET dictionary or the JSONB-container pattern must get
        # an RLS/retention/erasure review before being baselined.
        run: pnpm check:pii-columns

      - name: Env-schema completeness guard (D-091 #28, refs #2002)
        # Fails on a NEW raw process.env read of an identifier not declared in
        # that app's env schema (apps/<app>/src/lib/env.ts) — undeclared secrets
        # bypass boot validation and the rotation-path inventory.
        run: pnpm check:env-schema

      - name: Job service-role tenant-predicate guard (refs #2003)
        # Fails on a NEW filtered service-role read, in a background-job dir, of
        # a tenant_id-bearing table the d091 detector platform-exempts — the
        # gap that let the import-pipeline gmail read ship without a tenant
        # predicate.
        run: pnpm check:job-service-role-tenant

      - name: URL-validator guard (#1393/G2)
        # Fails on a new z.string().url() for a stored/rendered URL field —
        # must use safeUrl (@atc/contracts) which denies file://, cloud-metadata,
        # and RFC1918 hosts. env.ts operator config is exempt. (F-rag-pii-02.)
        run: pnpm check:url-validator

      - name: In-memory rate-limit guard (#1393/G4)
        # Fails on a NEW module-level Map/Set-backed rate limiter — per-instance
        # under Fluid Compute, so trivially bypassed across instances/cold starts.
        # Public/anon limiters must use Redis (incr/expire) or a DB-atomic counter.
        # Root cause of F-tok-01 / F-rag-wh-01. Pre-existing limiters baselined.
        run: pnpm check:rate-limit-store

      - name: Webhook replay-protection guard (#1393/G6)
        # Fails on a NEW inbound-signature webhook handler with no replay defense
        # (timestamp tolerance / dedup row / nonce). A valid signature proves the
        # body was signed, not that it's fresh — a captured delivery can be
        # re-POSTed. Root cause of F-rag-wh-02. Pre-existing gaps baselined.
        run: pnpm check:webhook-replay

      - name: AI-purpose constraint guard (#1271)
        # Fails if AICallPurpose union in call-wrapper.ts diverges from the
        # ai_call_log_purpose_check CHECK constraint in the latest migration.
        # Root cause of the "AI temporarily unavailable" incident: safeAwait
        # throws on constraint violation, so a missing purpose causes the
        # cost-log insert to fail and surfaces as an AI outage to users.
        # Pure source parse — no DB connection required.
        run: pnpm check:ai-purpose

      - name: Auth-error adoption guard (#556)
        run: pnpm check:auth-error

      - name: Debug/dev/test route guard (#1637)
        # Fails on any /api/debug|dev|test* route — forgotten scaffolding is a
        # classic unauthenticated foothold. Zero-tolerance (no baseline).
        run: pnpm check:debug-routes

      - name: Lifecycle-script supply-chain guard (#1636)
        # Fails on a NEW/CHANGED preinstall/install/postinstall/prepare hook in
        # any installed dependency (Shai-Hulud pattern). Keyed by content hash so
        # routine bumps don't churn; pre-existing hooks frozen in the baseline.
        run: pnpm check:lifecycle-scripts

      - name: Help-screenshot drift gate
        # Keeps the screenshot manifest (scripts/help-screenshots/manifest.ts),
        # the generated PNGs (apps/main/public/help/**), and the help docs that
        # reference them in lockstep — fails on broken image refs, orphans,
        # hand-placed (non-regenerable) images, and empty alt text.
        # See docs/runbooks/help-docs.md.
        run: pnpm check:help-screenshots

      - name: Error-injection probe (D-091 follow-up)
        # Forces handlers into DB-fail / resource-down / concurrent failure
        # modes that don't fire under happy-path testing. See
        # apps/main/test/error-injection/README.md and
        # docs/runbooks/error-injection-probe-design.md.
        run: pnpm test:error-injection

      - name: RAG unit tests (#792)
        # The root vitest config (vitest.config.ts) only includes apps/main +
        # tests/, so apps/rag's unit suite never ran in CI — RAG bugs (#805/#807/
        # #808) merged with zero CI coverage. Run apps/rag's own vitest here.
        run: pnpm test:rag

      - name: Build
        run: pnpm -r build
        env:
          PLATFORM_PRIMARY_DOMAIN: ci.example.com
          PLATFORM_DOMAIN_REGEX: ^([a-z0-9-]+)\.ci\.example\.com$
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci-placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci-placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder
          STRIPE_CONNECT_WEBHOOK_SECRET: whsec_ci-placeholder-connect
          INNGEST_SIGNING_KEY: signkey-ci-placeholder
          INNGEST_EVENT_KEY: eventkey-ci-placeholder
          SERVICE_JWT_PRIVATE_KEY: ci-placeholder-service-jwt-private-key
          SERVICE_JWT_KEY_ID_CURRENT: v1
          RAG_SERVICE_URL: https://rag.ci.example.com
          RAG_WEBHOOK_SECRET: ci-placeholder-rag-webhook-secret
          SUPABASE_RAG_URL: https://ci-rag.supabase.co
          SUPABASE_RAG_SERVICE_ROLE_KEY: ci-placeholder-rag-service-role-key
          SERVICE_JWT_PUBLIC_KEY: ci-placeholder-service-jwt-public-key
          SERVICE_JWT_ACCEPTED_KEY_IDS: v1
          REDIS_URL: redis://localhost:6379
          MAIN_APP_URL: https://ci.example.com
          MAIN_APP_ADMIN_API_KEY: ci-placeholder-admin-api-key
          OPENAI_API_KEY: ci-placeholder-openai-api-key
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          SUPABASE_RAG_ANON_KEY: ci-placeholder-rag-anon-key

      - name: Bundle secret scan (#1637)
        # Post-build: scan the .next output for a service_role JWT (decode the
        # role claim — the anon key is a JWT too and is meant to ship). gitleaks
        # scans source; this scans the built client bundle.
        run: pnpm scan:bundle-secrets
