name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
    # Doc-only PRs skip CodeQL on PRs. Not a required check, so a non-run can't
    # strand the PR; the weekly schedule + dev-push run still cover doc merges.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"
  schedule:
    # Weekly Monday 06:00 UTC — catches new GitHub-maintained rules.
    - cron: '0 6 * * 1'
  # Manual ad-hoc trigger — useful after batches of merges to confirm the
  # aggregate state is clean without waiting for a push event.
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds high-precision rules beyond the default set.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
