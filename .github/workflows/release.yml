name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3) — creates release/<version> from dev'
        required: true
        type: string

jobs:
  # ============================================================
  # Step 1: Create the release branch from dev
  # ============================================================

  create-branch:
    name: Create release/${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: release/${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.y.z (e.g. 1.2.3). Got: $VERSION"
            exit 1
          fi

      - name: Abort if branch already exists
        run: |
          VERSION="${{ inputs.version }}"
          if git ls-remote --exit-code --heads origin "release/$VERSION" > /dev/null 2>&1; then
            echo "::error::release/$VERSION already exists. Delete it first or choose a different version."
            exit 1
          fi

      - name: Create and push release branch
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$VERSION"
          git push origin "release/$VERSION"

  # ============================================================
  # Step 2: CI block — mirrors the deploy.yml gate set
  # ============================================================

  typecheck:
    name: Typecheck
    needs: [create-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

  lint:
    name: Lint
    needs: [create-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r lint

  test:
    name: Test
    needs: [create-branch]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm test

  secret-scan:
    name: Secret Scan
    needs: [create-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cve-scan:
    name: CVE Scan
    needs: [create-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Fail on critical CVEs
        run: pnpm audit --audit-level=critical

      - name: Warn on high CVEs
        run: |
          pnpm audit --audit-level=high --json 2>/dev/null | \
            node -e "
              const chunks = [];
              process.stdin.on('data', d => chunks.push(d));
              process.stdin.on('end', () => {
                try {
                  const report = JSON.parse(Buffer.concat(chunks).toString());
                  const vulns = report.vulnerabilities || {};
                  Object.values(vulns)
                    .filter(v => v.severity === 'high')
                    .forEach(v => {
                      console.log('::warning::High CVE in ' + v.name + ': ' + (v.via?.[0]?.url || 'see pnpm audit'));
                    });
                } catch (_) {}
              });
            " || true

  rls-check:
    name: RLS & Grants Check
    needs: [create-branch]
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Check RLS drift (vs test DB)
        run: pnpm rls:check

      - name: Check grants drift (vs prod DB)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_PROD_DB_URL }}
        run: pnpm grants:check

  contract-tests:
    name: Contract Tests
    needs: [create-branch, typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:contracts

  cross-tenant-probe:
    name: Cross-Tenant Probe
    needs: [create-branch, typecheck, lint, test, secret-scan]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      APP_BASE_URL: ${{ secrets.APP_STAGING_URL }}
      CROSS_TENANT_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:cross-tenant

  # ============================================================
  # Step 3: Staging block (skipped until STAGING_PIPELINE_ENABLED)
  # ============================================================

  db-copy:
    name: Copy Prod DB to Staging
    needs:
      [
        create-branch,
        typecheck,
        lint,
        test,
        secret-scan,
        cve-scan,
        rls-check,
        contract-tests,
        cross-tenant-probe,
      ]
    if: vars.STAGING_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump production database
        run: |
          pg_dump "$PROD_DB_URL" \
            --no-owner \
            --no-acl \
            --format=custom \
            --file=prod_dump.pgdump

      - name: Restore to staging
        run: |
          psql "$DB_URL" -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid();"
          pg_restore \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --dbname="$DB_URL" \
            prod_dump.pgdump

      - run: psql "$DB_URL" -f scripts/staging-fixups.sql

  deploy-staging:
    name: Deploy to Staging
    needs: [create-branch, db-copy]
    if: vars.STAGING_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.ai-travelconcierge.com
    env:
      DB_URL: ${{ secrets.DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEST_OVERRIDE_EMAIL: ${{ secrets.TEST_OVERRIDE_EMAIL }}
      TEST_OVERRIDE_PHONE: ${{ secrets.TEST_OVERRIDE_PHONE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations
        working-directory: apps/main
        run: npx supabase db push --include-all --db-url "$DB_URL"

      - name: Migration drift check
        run: pnpm tsx scripts/check-schema-drift.ts --target=main --db-url "$DB_URL"

      - name: Vercel deploy (preview)
        run: |
          vercel pull --environment=preview --yes --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN

      - name: Run Playwright E2E tests
        env:
          BASE_URL: https://staging.ai-travelconcierge.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          TEST_E2E_OWNER_EMAIL: ${{ secrets.TEST_E2E_OWNER_EMAIL }}
          TEST_E2E_OWNER_PASSWORD: ${{ secrets.TEST_E2E_OWNER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Smoke test staging
        run: |
          sleep 20
          curl -f https://staging.ai-travelconcierge.com/api/health

  # ============================================================
  # Step 4: Production (requires manual approval via environment gate)
  # ============================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      [
        create-branch,
        typecheck,
        lint,
        test,
        secret-scan,
        cve-scan,
        rls-check,
        contract-tests,
        cross-tenant-probe,
        deploy-staging,
      ]
    # always() so this runs even when staging jobs were skipped (not yet provisioned).
    # !failure() + !cancelled() still block production if staging ran and failed.
    if: always() && !failure() && !cancelled()
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: production
      url: https://ai-travelconcierge.com
    env:
      DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations to production
        working-directory: apps/main
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_PROD_DB_URL secret is not set. Aborting."
            exit 1
          fi
          npx supabase db push --include-all --db-url "$DB_URL"

      - name: Migration drift check
        run: pnpm tsx scripts/check-schema-drift.ts --target=main --db-url "$DB_URL"

      - name: Verify configured models are live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm tsx scripts/check-models-live.ts

      - name: Install Vercel CLI
        run: npm install -g vercel@54

      - name: Vercel deploy (production)
        run: vercel deploy --target=production --yes --token=$VERCEL_TOKEN

      - name: Smoke test production
        run: |
          sleep 30
          curl -f https://ai-travelconcierge.com/api/health

      - name: Sync Inngest app
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
        run: |
          if [ -z "$INNGEST_API_KEY" ]; then
            echo "::warning::INNGEST_API_KEY not set — skipping Inngest sync"
            exit 0
          fi
          curl -fsS -X POST "https://api.inngest.com/v2/apps/atc-main/syncs" \
            -H "Authorization: Bearer $INNGEST_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"url": "https://ai-travelconcierge.com/api/inngest"}' \
            || echo "::warning::Inngest sync failed — verify INNGEST_API_KEY and resync manually"

      - name: Create release tag
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes \
            --target "release/$VERSION"

      - name: Merge release branch back to dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CREATE_OUT=$(gh pr create \
            --base dev \
            --head "release/${{ inputs.version }}" \
            --title "chore: merge release/${{ inputs.version }} back to dev" \
            --label "release-merge" \
            --body "Automated post-release merge." 2>&1) || {
            if echo "$CREATE_OUT" | grep -q "No commits between"; then
              echo "Release branch already in sync with dev — nothing to merge back."
              exit 0
            fi
            echo "$CREATE_OUT"
            exit 1
          }
          echo "$CREATE_OUT"
          gh pr merge --merge --auto || { echo "Auto-merge failed or conflict — resolve manually. PR URL above."; exit 0; }
