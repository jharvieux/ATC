# Nightly full-suite vitest run against `dev`.
#
# Why: Phase 1 shift-left has PRs run only affected tests (vitest related).
# A PR that touches a file with no current importers (or one whose effects
# are not statically resolvable — e.g. dynamic import, env-var change) can
# still break a test that was never re-run. This nightly catches that.
#
# Failure path: opens a GitHub issue with the `nightly-failure` label.
# Body lists every failing test (file:test format) and a link to the run.
# One issue per failure; no auto-close — operator triages explicitly.
# Filter your GitHub notifications on `label:nightly-failure`.
#
# Manual trigger via workflow_dispatch is supported so the operator can
# force a run after merging a suspicious change.

name: nightly-full-test

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-test:
    name: Full vitest suite
    runs-on: ubuntu-latest
    # Share the `shared-test-db` concurrency group with deploy.yml's DB jobs so
    # this nightly's `supabase db push` (main AND rag) can never run at the same
    # time as a dev-merge / merge-queue push against the same databases —
    # directly mitigating #1904 (nightly RAG push vs concurrent deploy.yml RAG
    # access). cancel-in-progress: false — never cancel a run mid-DB-rebuild.
    concurrency:
      group: shared-test-db
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      # Activates the DB-backed suites (rls, proxy, cross-tenant-inngest probes)
      # that PR CI shifts left. Without it they describe.skip and the nightly
      # safety net would silently cover nothing.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      # Activates the RAG-app DB-backed suites (e.g. match-region-segment.test.ts,
      # #1470) the same way SUPABASE_DB_URL above activates the main-app ones.
      # Without it they describe.skip and the nightly safety net silently covers
      # nothing for the RAG app. See #1758.
      SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
      # Activates the stripe-webhook integration suite. Placeholders are fine:
      # the suite self-signs events with STRIPE_WEBHOOK_SECRET and the handler
      # verifies with the same value (pure HMAC, no Stripe API call). The Stripe
      # client is constructed but never makes a network request on this path.
      STRIPE_SECRET_KEY: sk_test_ci-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Ensure nightly-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "nightly-failure" \
            --color "b60205" \
            --description "Nightly full-test suite failed on dev. Triage the linked run." \
            --force \
            --repo "${{ github.repository }}" || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight critical isolation credentials
        id: isolation-preflight
        # Keep the nightly's report-first posture: capture a missing-secret
        # failure so the final step can open the operator-visible issue instead
        # of aborting here and silently skipping that reporting path.
        run: |
          set +e
          pnpm tsx scripts/check-critical-rag-db.ts
          STATUS=$?
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reset main test DB before apply (#1660 / #1896)
        id: reset-main
        # Same reset-then-apply as deploy.yml's rls-snapshot-diff: rebuild the
        # main test DB from scratch so an orphaned ledger row from an abandoned
        # branch's CI run can't wedge this nightly's push. Serialized against
        # deploy.yml via the shared-test-db group above.
        #
        # Guarded exactly like the RAG reset below (#1961): an empty
        # RESET_TARGET_DB_URL means the SUPABASE_TEST_DB_URL secret was
        # rotated/renamed/removed. Report it via reset_main_status rather than
        # letting the step exit non-zero — an unguarded failure makes Actions
        # skip every later step INCLUDING `Open issue on failure`, so a missing
        # DB secret would produce a bare red X and no `nightly-failure` issue:
        # silence in the one channel operators are told to watch. The reset
        # script itself exits 0 (skip) on an unset URL for secret-less callers,
        # so this explicit check is what turns "silently ran nothing" into a
        # reported failure for this schedule-only workflow.
        env:
          CONFIRM_TEST_DB_RESET: "true"
          # Distinctly-named target var (#1896 audit): the reset script reads
          # RESET_TARGET_DB_URL, never the generic SUPABASE_DB_URL, so this
          # destructive step can only ever be pointed at the test DB — never the
          # prod DB that SUPABASE_DB_URL binds to in prod-drift-check.yml.
          RESET_TARGET_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          if [ -z "$RESET_TARGET_DB_URL" ]; then
            echo "::error::SUPABASE_TEST_DB_URL is empty — the main test DB reset cannot run (#1961)."
            echo "reset_main_status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          pnpm db:reset:ci
          STATUS=$?
          echo "reset_main_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply Supabase migrations to test DB
        id: migrate-main
        # Ensures the test DB schema matches dev before running integration tests.
        # Without this, RPC-signature changes (e.g. adding a parameter) leave the
        # test DB on the old signature, causing integration tests to fail with 500.
        #
        # Gated on the reset above succeeding (#1961). That gate also subsumes
        # the missing-secret case: SUPABASE_DB_URL (job env) and the reset step's
        # RESET_TARGET_DB_URL are the SAME secret expression (secrets.
        # SUPABASE_TEST_DB_URL), so an unset secret always surfaces as
        # reset_main_status != 0 and this step never runs — which is why the old
        # `-z "$SUPABASE_DB_URL"` / `exit 1` guard is gone (that exit 1 was the
        # unguarded abort #1961 is about). On a real push failure we capture the
        # exit code (set +e + PIPESTATUS, D-349) and hand it to the issue-open
        # step as a DISTINCT signal instead of hard-failing the job with a bare
        # red X and no issue. The teed log is redacted through
        # parse-nightly-failures.mjs before any of it reaches the PUBLIC issue
        # body (#1851).
        if: steps.reset-main.outputs.reset_main_status == '0'
        working-directory: apps/main
        run: |
          set +e
          npx supabase db push --include-all --db-url "$SUPABASE_DB_URL" 2>&1 | tee main-migrate-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reset RAG test DB before apply (#1914)
        id: reset-rag
        # Symmetric reset for the RAG test DB, same rationale as the main-DB
        # reset above (#1660 / #1896) — but this one is the confirmed live
        # fix for #1919/#1920: a failed RAG push (0001 applies, 0002 fails)
        # left the RAG test DB's schema and ledger diverged, wedging every
        # nightly since with "relation ... already exists" (SQLSTATE 42P07)
        # on the push below. Resetting first makes each run's push
        # self-contained, same as the main-DB reset already does. Serialized
        # against deploy.yml via the shared-test-db group above.
        #
        # Placed here — directly before its apply and BEFORE the long vitest
        # step — deliberately. Between the DROP SCHEMA and the push below the
        # RAG test DB is EMPTY, and that DB is shared: deploy.yml binds it as
        # SUPABASE_RAG_DB_URL for `rls-snapshot-diff` (a REQUIRED check) and
        # never re-seeds it. If the job dies inside that window (OOM, 6h
        # timeout, cancellation), the empty schema drifts from
        # db/rls-snapshot-rag.sql and turns that required check red on EVERY
        # PR until the next nightly succeeds. Keeping reset and push adjacent
        # holds the window to seconds; gating them behind vitest would widen
        # it to the length of the whole suite. Behaviour-neutral: the RAG
        # suite still runs after the push, and the main suite never connects
        # to the RAG DB.
        env:
          CONFIRM_TEST_DB_RESET: "true"
          # Distinctly-named target var (#1896 audit) — see main-DB reset
          # step above for why this is never the generic SUPABASE_RAG_DB_URL.
          RESET_TARGET_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
        # The reset script skips (exit 0) on an unset URL for secret-less
        # callers (Dependabot on deploy.yml). This workflow has no such
        # callers — it only ever runs on schedule / workflow_dispatch, where
        # the secret must be present — so an empty URL here means the secret
        # was misnamed, rotated, or removed. That must be reported, not
        # silently skipped: a no-op reset lets the push below re-wedge on
        # 42P07 and retires the #1914 fix in a way only a log-reader would
        # notice.
        #
        # Report it via reset_status rather than `exit 1`, though. An
        # unguarded non-zero step makes Actions skip EVERY later step — which
        # would take out both the main vitest suite (this workflow's stated
        # purpose) and the issue-open step, so a missing RAG secret would
        # produce a bare red X and no `nightly-failure` issue: silence in the
        # one channel operators are told to watch. Same set +e / $? capture /
        # exit 0 idiom as rag-migrate below; downstream RAG-only steps gate on
        # the output, and the issue-open step turns it into a real issue.
        run: |
          if [ -z "$RESET_TARGET_DB_URL" ]; then
            echo "::error::SUPABASE_RAG_TEST_DB_URL is empty — the RAG test DB reset cannot run (#1914)."
            echo "reset_status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          pnpm db:reset:ci -- --target=rag
          STATUS=$?
          echo "reset_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply Supabase migrations to RAG test DB
        id: rag-migrate
        # Mirrors the "Apply Supabase migrations to test DB" step above, but for
        # the RAG app's own DB and migration set (apps/rag/supabase/migrations),
        # so the RAG suite below runs against a schema matching dev instead of
        # drifted/stale schema (#1893). No ledger pre-check like deploy.yml's
        # rls-snapshot-diff job: that guards a race between two un-diffed PR
        # BRANCHES; this runs on already-merged `dev` where every migration is
        # applied, so the push is idempotent.
        #
        # Gated on the reset above succeeding. That gate also subsumes the
        # missing-secret case: SUPABASE_RAG_DB_URL (job env, above) and the
        # reset step's RESET_TARGET_DB_URL are the SAME secret expression, so
        # an unset secret always shows up here as reset_status != 0 and this
        # step never runs. No `-z "$SUPABASE_RAG_DB_URL"` check inside — it
        # could never fire. Pushing to an un-reset DB is the 42P07 wedge
        # #1914 exists to prevent.
        #
        # On a real push failure we capture the exit code (set +e + PIPESTATUS,
        # D-349 — same idiom as the vitest steps, which is why the output is
        # teed) and hand it to the issue-open step as a DISTINCT signal, instead
        # of letting `bash -e` hard-fail the job with a bare red X and no issue.
        # That's what makes an apply/drift failure distinguishable from a test
        # regression in the nightly issue body (#1893 acceptance criterion). The
        # teed log is redacted through parse-nightly-failures.mjs before any of
        # it reaches the PUBLIC issue body (#1851).
        if: steps.reset-rag.outputs.reset_status == '0'
        working-directory: apps/rag
        run: |
          set +e
          npx supabase db push --include-all --db-url "$SUPABASE_RAG_DB_URL" 2>&1 | tee rag-migrate-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seed Tier-2 fixture tenant
        id: seed-tier2
        # The DB-backed inngest probes act on the Tier-2 fixture tenant; seed it
        # idempotently so their FK targets exist.
        #
        # Gated on the main reset + migrate succeeding — a bad/absent schema
        # would make the seed fail for a downstream reason. Previously this ran
        # `pnpm tsx ...` unguarded and "failed loudly with no issue filed"; that
        # was the silent-nightly hole #1961 closes — a seed failure (e.g. the
        # test DB secret rotating) aborted the job before `Open issue on
        # failure`, so no `nightly-failure` issue was filed. Now it captures its
        # status (set +e + PIPESTATUS, D-349) and the issue-open step reports it
        # as a schema/infra section. Its stdout/stderr still lands in the run log
        # for triage; not teed to a file because the section points at the run
        # log rather than embedding the (potentially URL-bearing) output.
        if: steps.reset-main.outputs.reset_main_status == '0' && steps.migrate-main.outputs.exit_status == '0'
        run: |
          set +e
          pnpm tsx scripts/seed-tier2-test.ts
          STATUS=${PIPESTATUS[0]}
          echo "seed_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run full vitest suite
        id: vitest
        # JSON reporter writes per-test results we parse for failure detail.
        # `default` runs alongside it so a beforeAll/afterAll (hook) throw —
        # which blanks the ENTIRE JSON report to testResults: [] even when
        # other files in the run passed — still lands the failing file/suite
        # in the console log (#1738). exit 0 so this step doesn't
        # short-circuit the workflow before the issue-open step runs — we'd
        # rather report a failure than silently red-X the workflow without
        # an issue.
        #
        # --no-file-parallelism: the DB-backed suites share one Supabase project
        # and some inngest probes run global crons (billing-period-rollover,
        # abuse-recompute) that touch every tenant; running them concurrently
        # with the rls suite's ephemeral tenants corrupts its teardown. Serial
        # execution isolates them. Acceptable cost for a nightly.
        # Tee console output (default reporter) to a file so the issue-open step
        # can grep it for vitest's unhandled-error banner (#1833) — the JSON
        # reporter's output has no field for those, they only ever reach stdout.
        # This workflow has no `shell:` key, so GH Actions runs `run:` blocks
        # with the implicit default `bash -e {0}` — NOT `-eo pipefail`
        # (`shell: bash` would add `-o pipefail`, but we don't declare it).
        # Without pipefail, `$?` after a pipe reflects `tee`'s exit code, not
        # vitest's, so a failing suite piped through `tee` always looks like
        # success. Read `${PIPESTATUS[0]}` instead — the bash array holding
        # each pipeline component's exit status, index 0 = vitest — so a
        # green `tee` can never mask a red test run (regression: tonight's
        # run 29227645576 reported success on a real 1-failed suite).
        #
        # Gated on the main DB prep (reset + migrate) succeeding (#1961): a
        # failed reset/migrate means the schema is absent or stale, so running
        # the suite would only bury the real prep failure under a wall of
        # unrelated errors. When skipped, exit_status is never written and the
        # issue-open step handles the empty MAIN_STATUS explicitly. Not gated on
        # the Tier-2 seed — a seed failure is reported as its own section while
        # the suite still runs, so non-probe coverage isn't lost.
        if: steps.reset-main.outputs.reset_main_status == '0' && steps.migrate-main.outputs.exit_status == '0'
        run: |
          set +e
          pnpm vitest run --reporter=default --reporter=json --outputFile=vitest-report.json --no-file-parallelism 2>&1 | tee vitest-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run apps/rag vitest suite
        id: vitest-rag
        # The root vitest.config.ts only includes tests/** and apps/main/test/**
        # (same reason ci.yml's separate "RAG unit tests (#792)" step exists) —
        # the step above never touches apps/rag, so SUPABASE_RAG_DB_URL (set on
        # this job for #1758) was wired to nothing (#1863). Run apps/rag's own
        # suite the same way `pnpm test:rag` does (`pnpm --dir apps/rag run
        # test`), with the same reporter flags + PIPESTATUS capture as the main
        # suite above (D-349 — no `shell:` key here either).
        #
        # Gated on rag-migrate succeeding (exit_status == '0', which also
        # covers the skip-with-notice no-secret case above): a failed schema
        # push means the suite would run a full vitest pass against known-bad
        # schema, burning minutes and burying the real migrate failure under a
        # wall of unrelated test errors (#1893 audit finding 1). When this step
        # is skipped, its exit_status output is never written — the issue-open
        # step below handles that empty value explicitly rather than treating
        # it as a distinct suite failure.
        if: steps.rag-migrate.outputs.exit_status == '0'
        run: |
          set +e
          pnpm --dir apps/rag run test -- --reporter=default --reporter=json --outputFile=rag-vitest-report.json --no-file-parallelism 2>&1 | tee apps/rag/rag-vitest-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue on failure
        if: steps.isolation-preflight.outputs.exit_status != '0' || steps.vitest.outputs.exit_status != '0' || steps.vitest-rag.outputs.exit_status != '0' || steps.rag-migrate.outputs.exit_status != '0' || steps.reset-rag.outputs.reset_status != '0' || steps.reset-main.outputs.reset_main_status != '0' || steps.migrate-main.outputs.exit_status != '0' || steps.seed-tier2.outputs.seed_status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISOLATION_PREFLIGHT_STATUS: ${{ steps.isolation-preflight.outputs.exit_status }}
          MAIN_STATUS: ${{ steps.vitest.outputs.exit_status }}
          MAIN_RESET_STATUS: ${{ steps.reset-main.outputs.reset_main_status }}
          MAIN_MIGRATE_STATUS: ${{ steps.migrate-main.outputs.exit_status }}
          MAIN_SEED_STATUS: ${{ steps.seed-tier2.outputs.seed_status }}
          RAG_STATUS: ${{ steps.vitest-rag.outputs.exit_status }}
          RAG_MIGRATE_STATUS: ${{ steps.rag-migrate.outputs.exit_status }}
          RAG_RESET_STATUS: ${{ steps.reset-rag.outputs.reset_status }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Parses vitest-report.json (per-assertion + suite-level failures,
          # #1833) and greps the teed vitest-console.log for the
          # unhandled-error banner (also #1833, console-only — the JSON
          # reporter has no field for it). Redacts postgres:// URLs, Bearer
          # tokens, and any exact match against this job's known secret env
          # values BEFORE either piece reaches the public issue body this
          # step opens (#1851 audit finding 1). Logic + fixtures + tests live
          # in scripts/parse-nightly-failures.mjs /
          # tests/unit/scripts/parse-nightly-failures.test.ts (#1851 audit
          # finding 2 — this used to be untested inline shell/node).
          #
          # Run once per suite (main, rag) and only include a suite's section
          # when THAT suite's own exit code was non-zero (#1863) — either
          # suite can fail independently, and a passing suite's "no per-test
          # detail" fallback would otherwise read as a false failure.
          # MAIN_STATUS is empty when the main suite was skipped because a main
          # DB prep step (reset/migrate, #1961) failed — handle that explicitly,
          # like RAG_STATUS below, so the `!= "0"` arm doesn't parse a
          # non-existent report and read as a phantom test failure. The prep
          # failure itself is reported by the MAIN_RESET/MAIN_MIGRATE sections.
          if [ -z "$MAIN_STATUS" ]; then
            MAIN_SECTION="### apps/main"$'\n\n'"(skipped — the main test DB reset or migration apply failed; see the schema section below)"
          elif [ "$MAIN_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs vitest-report.json vitest-console.log nightly-failing-list.md nightly-unhandled-section.md
            MAIN_SECTION="### apps/main"$'\n\n'"$(cat nightly-failing-list.md)"$'\n'"$(cat nightly-unhandled-section.md)"
          else
            MAIN_SECTION=""
          fi
          if [ "$ISOLATION_PREFLIGHT_STATUS" != "0" ]; then
            ISOLATION_PREFLIGHT_SECTION="### Critical isolation credential preflight FAILED"$'\n\n'"At least one main Supabase API/DB credential or the RAG DB URL is missing. The RLS suites can skip without complete credentials, so this run is not valid isolation evidence. Check the preflight step's error for the exact missing names."
          else
            ISOLATION_PREFLIGHT_SECTION=""
          fi
          # A failed main test DB reset (#1961) means the DB was never rebuilt,
          # so the migrate, Tier-2 seed, and main suite below it were skipped.
          # Most likely cause is a missing/rotated SUPABASE_TEST_DB_URL. Report
          # it here so it surfaces as a `nightly-failure` issue instead of a log
          # line nobody reads — the RAG path still runs and reports independently.
          if [ -n "$MAIN_RESET_STATUS" ] && [ "$MAIN_RESET_STATUS" != "0" ]; then
            MAIN_RESET_SECTION="### apps/main — test DB reset FAILED (exit $MAIN_RESET_STATUS)"$'\n\n'"The main test DB was not reset, so the migration apply, Tier-2 seed, and the main suite were skipped. Check that the \`SUPABASE_TEST_DB_URL\` secret exists and is valid, then see the run log for the reset step's \`::error::\` output. Triage as schema/infra, not a test regression."
          else
            MAIN_RESET_SECTION=""
          fi
          # A non-zero main migration apply is a schema/infra failure, NOT a test
          # regression (#1961) — surface it as its own section, mirroring the RAG
          # one below. Empty when skipped on a failed reset (covered above), so
          # `-n`-guard it. The teed push log is redacted (public repo, #1851) via
          # the parser's `migrate` mode before it lands here.
          if [ -n "$MAIN_MIGRATE_STATUS" ] && [ "$MAIN_MIGRATE_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs migrate apps/main/main-migrate-console.log nightly-main-migrate-section.md
            MAIN_MIGRATE_SECTION="### apps/main — test DB migration apply FAILED (exit $MAIN_MIGRATE_STATUS)"$'\n\n'"\`supabase db push\` to the main test DB failed before the suite ran, so the main suite was skipped rather than run against a stale or absent schema. Triage this as a schema/infra failure, not a test regression."$'\n\n'"$(cat nightly-main-migrate-section.md)"
          else
            MAIN_MIGRATE_SECTION=""
          fi
          # A non-zero Tier-2 seed (#1961) leaves the DB-backed inngest probes
          # without their FK targets. The main suite still ran (it's only gated
          # on reset+migrate), so its probe failures appear above; this section
          # names the seed as the root cause so triage doesn't chase them as
          # independent regressions. Empty when skipped on a failed reset/migrate.
          if [ -n "$MAIN_SEED_STATUS" ] && [ "$MAIN_SEED_STATUS" != "0" ]; then
            MAIN_SEED_SECTION="### apps/main — Tier-2 fixture seed FAILED (exit $MAIN_SEED_STATUS)"$'\n\n'"Seeding the Tier-2 fixture tenant failed, so any DB-backed inngest probe results in the main suite above ran without their FK targets. See the seed step's output in the run log. Triage as schema/infra, not a test regression."
          else
            MAIN_SEED_SECTION=""
          fi
          # vitest-rag is gated on rag-migrate succeeding (#1893 audit finding
          # 1), which is itself gated on the reset succeeding (#1914) — so a
          # failure of either means the step never ran and never wrote its
          # exit_status output: RAG_STATUS is empty, not "0" or a nonzero
          # code. Handle that explicitly with its own branch instead
          # of falling into the `!= "0"` arm below: that arm calls the parser
          # against report/console files that don't exist (the run never
          # happened), and its "(no JSON report; see run logs)" fallback would
          # read like an unexplained test failure duplicating the
          # RAG_MIGRATE_SECTION below rather than pointing at it.
          if [ -z "$RAG_STATUS" ]; then
            RAG_SECTION="### apps/rag"$'\n\n'"(skipped — the RAG test DB reset or migration apply failed; see the schema section above)"
          elif [ "$RAG_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs apps/rag/rag-vitest-report.json apps/rag/rag-vitest-console.log nightly-rag-failing-list.md nightly-rag-unhandled-section.md
            RAG_SECTION="### apps/rag"$'\n\n'"$(cat nightly-rag-failing-list.md)"$'\n'"$(cat nightly-rag-unhandled-section.md)"
          else
            RAG_SECTION=""
          fi
          # A failed RAG reset (#1914) means the DB was never rebuilt, so the
          # apply and suite below it were skipped rather than run against a
          # possibly-wedged schema. Most likely cause is a missing/rotated
          # SUPABASE_RAG_TEST_DB_URL. Report it here so it surfaces as a
          # `nightly-failure` issue instead of a log line nobody reads — the
          # main suite still ran and reports independently above.
          if [ -n "$RAG_RESET_STATUS" ] && [ "$RAG_RESET_STATUS" != "0" ]; then
            RAG_RESET_SECTION="### apps/rag — test DB reset FAILED (exit $RAG_RESET_STATUS)"$'\n\n'"The RAG test DB was not reset, so the migration apply and the RAG suite were skipped. Check that the \`SUPABASE_RAG_TEST_DB_URL\` secret exists and is valid, then see the run log for the reset step's \`::error::\` output. Triage as schema/infra, not a test regression."
          else
            RAG_RESET_SECTION=""
          fi
          # A non-zero RAG migration apply is a schema/infra failure, NOT a test
          # regression — surface it as its own section so triage doesn't chase a
          # phantom test bug (#1893). The teed push log is redacted (public repo,
          # #1851) via the parser's `migrate` mode before it lands here.
          # Empty when the step was skipped on a failed reset — the section
          # above covers that case, so `-n`-guard this the same as RAG_STATUS.
          if [ -n "$RAG_MIGRATE_STATUS" ] && [ "$RAG_MIGRATE_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs migrate apps/rag/rag-migrate-console.log nightly-rag-migrate-section.md
            RAG_MIGRATE_SECTION="### apps/rag — test DB migration apply FAILED (exit $RAG_MIGRATE_STATUS)"$'\n\n'"\`supabase db push\` to the RAG test DB failed before the suite ran, so any RAG results below ran against a stale or absent schema. Triage this as a schema/infra failure, not a test regression."$'\n\n'"$(cat nightly-rag-migrate-section.md)"
          else
            RAG_MIGRATE_SECTION=""
          fi

          BODY=$(cat <<EOF
          ## Nightly full-test failure — $DATE

          Full vitest suite (apps/main and/or apps/rag) failed on \`dev\`. The affected-test path in PR CI didn't catch this — it's either:
          - A test that depends on cross-cutting state (env, schema, fixtures) not in any PR's diff
          - A flake (re-run before chasing)
          - A regression in code the affected-tests heuristic missed (deep utility / dynamic import / etc.)

          **Run**: $RUN_URL

          **Failing tests**:
          $ISOLATION_PREFLIGHT_SECTION
          $MAIN_SECTION
          $MAIN_RESET_SECTION
          $MAIN_MIGRATE_SECTION
          $MAIN_SEED_SECTION
          $RAG_RESET_SECTION
          $RAG_MIGRATE_SECTION
          $RAG_SECTION

          Triage by re-running the workflow once. If it stays red, it's a real regression — bisect across commits to \`dev\` since the last green nightly.

          (Posted by \`nightly-full-test\`.)
          EOF
          )

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly full-test failed $DATE" \
            --body "$BODY" \
            --label "nightly-failure"
