# Nightly full-suite vitest run against `dev`.
#
# Why: Phase 1 shift-left has PRs run only affected tests (vitest related).
# A PR that touches a file with no current importers (or one whose effects
# are not statically resolvable — e.g. dynamic import, env-var change) can
# still break a test that was never re-run. This nightly catches that.
#
# Failure path: opens a GitHub issue with the `nightly-failure` label.
# Body lists every failing test (file:test format) and a link to the run.
# One issue per failure; no auto-close — operator triages explicitly.
# Filter your GitHub notifications on `label:nightly-failure`.
#
# Manual trigger via workflow_dispatch is supported so the operator can
# force a run after merging a suspicious change.

name: nightly-full-test

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-test:
    name: Full vitest suite
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
      # Activates the DB-backed suites (rls, proxy, cross-tenant-inngest probes)
      # that PR CI shifts left. Without it they describe.skip and the nightly
      # safety net would silently cover nothing.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      # Activates the RAG-app DB-backed suites (e.g. match-region-segment.test.ts,
      # #1470) the same way SUPABASE_DB_URL above activates the main-app ones.
      # Without it they describe.skip and the nightly safety net silently covers
      # nothing for the RAG app. See #1758.
      SUPABASE_RAG_DB_URL: ${{ secrets.SUPABASE_RAG_TEST_DB_URL }}
      # Activates the stripe-webhook integration suite. Placeholders are fine:
      # the suite self-signs events with STRIPE_WEBHOOK_SECRET and the handler
      # verifies with the same value (pure HMAC, no Stripe API call). The Stripe
      # client is constructed but never makes a network request on this path.
      STRIPE_SECRET_KEY: sk_test_ci-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Ensure nightly-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "nightly-failure" \
            --color "b60205" \
            --description "Nightly full-test suite failed on dev. Triage the linked run." \
            --force \
            --repo "${{ github.repository }}" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Supabase migrations to test DB
        # Ensures the test DB schema matches dev before running integration tests.
        # Without this, RPC-signature changes (e.g. adding a parameter) leave the
        # test DB on the old signature, causing integration tests to fail with 500.
        working-directory: apps/main
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is empty (check SUPABASE_TEST_DB_URL secret). Aborting."
            exit 1
          fi
          npx supabase db push --include-all --db-url "$SUPABASE_DB_URL"

      - name: Seed Tier-2 fixture tenant
        # The DB-backed inngest probes act on the Tier-2 fixture tenant; seed it
        # idempotently so their FK targets exist. Fails the run loudly (no issue
        # filed) if seeding breaks — that's an infra fault, not a test regression.
        run: pnpm tsx scripts/seed-tier2-test.ts

      - name: Run full vitest suite
        id: vitest
        # JSON reporter writes per-test results we parse for failure detail.
        # `default` runs alongside it so a beforeAll/afterAll (hook) throw —
        # which blanks the ENTIRE JSON report to testResults: [] even when
        # other files in the run passed — still lands the failing file/suite
        # in the console log (#1738). exit 0 so this step doesn't
        # short-circuit the workflow before the issue-open step runs — we'd
        # rather report a failure than silently red-X the workflow without
        # an issue.
        #
        # --no-file-parallelism: the DB-backed suites share one Supabase project
        # and some inngest probes run global crons (billing-period-rollover,
        # abuse-recompute) that touch every tenant; running them concurrently
        # with the rls suite's ephemeral tenants corrupts its teardown. Serial
        # execution isolates them. Acceptable cost for a nightly.
        # Tee console output (default reporter) to a file so the issue-open step
        # can grep it for vitest's unhandled-error banner (#1833) — the JSON
        # reporter's output has no field for those, they only ever reach stdout.
        # This workflow has no `shell:` key, so GH Actions runs `run:` blocks
        # with the implicit default `bash -e {0}` — NOT `-eo pipefail`
        # (`shell: bash` would add `-o pipefail`, but we don't declare it).
        # Without pipefail, `$?` after a pipe reflects `tee`'s exit code, not
        # vitest's, so a failing suite piped through `tee` always looks like
        # success. Read `${PIPESTATUS[0]}` instead — the bash array holding
        # each pipeline component's exit status, index 0 = vitest — so a
        # green `tee` can never mask a red test run (regression: tonight's
        # run 29227645576 reported success on a real 1-failed suite).
        run: |
          set +e
          pnpm vitest run --reporter=default --reporter=json --outputFile=vitest-report.json --no-file-parallelism 2>&1 | tee vitest-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply Supabase migrations to RAG test DB
        id: rag-migrate
        # Mirrors the "Apply Supabase migrations to test DB" step above, but for
        # the RAG app's own DB and migration set (apps/rag/supabase/migrations),
        # so the RAG suite below runs against a schema matching dev instead of
        # drifted/stale schema (#1893). No ledger pre-check like deploy.yml's
        # rls-snapshot-diff job: that guards a race between two un-diffed PR
        # BRANCHES; this runs on already-merged `dev` where every migration is
        # applied, so the push is idempotent.
        #
        # SUPABASE_RAG_DB_URL is the RAG-suite activation secret (job env). When
        # it's unset the RAG suite describe.skips, so skip the push too (a push
        # to no DB would error) — skip-with-notice, exit_status=0, same posture
        # as deploy.yml's apply step.
        #
        # On a real push failure we capture the exit code (set +e + PIPESTATUS,
        # D-349 — same idiom as the vitest steps, which is why the output is
        # teed) and hand it to the issue-open step as a DISTINCT signal, instead
        # of letting `bash -e` hard-fail the job with a bare red X and no issue.
        # That's what makes an apply/drift failure distinguishable from a test
        # regression in the nightly issue body (#1893 acceptance criterion). The
        # teed log is redacted through parse-nightly-failures.mjs before any of
        # it reaches the PUBLIC issue body (#1851).
        working-directory: apps/rag
        run: |
          if [ -z "$SUPABASE_RAG_DB_URL" ]; then
            echo "SUPABASE_RAG_DB_URL not set — skipping RAG migration apply; the RAG suite describe.skips without it."
            echo "exit_status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npx supabase db push --include-all --db-url "$SUPABASE_RAG_DB_URL" 2>&1 | tee rag-migrate-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run apps/rag vitest suite
        id: vitest-rag
        # The root vitest.config.ts only includes tests/** and apps/main/test/**
        # (same reason ci.yml's separate "RAG unit tests (#792)" step exists) —
        # the step above never touches apps/rag, so SUPABASE_RAG_DB_URL (set on
        # this job for #1758) was wired to nothing (#1863). Run apps/rag's own
        # suite the same way `pnpm test:rag` does (`pnpm --dir apps/rag run
        # test`), with the same reporter flags + PIPESTATUS capture as the main
        # suite above (D-349 — no `shell:` key here either).
        run: |
          set +e
          pnpm --dir apps/rag run test -- --reporter=default --reporter=json --outputFile=rag-vitest-report.json --no-file-parallelism 2>&1 | tee apps/rag/rag-vitest-console.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue on failure
        if: steps.vitest.outputs.exit_status != '0' || steps.vitest-rag.outputs.exit_status != '0' || steps.rag-migrate.outputs.exit_status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_STATUS: ${{ steps.vitest.outputs.exit_status }}
          RAG_STATUS: ${{ steps.vitest-rag.outputs.exit_status }}
          RAG_MIGRATE_STATUS: ${{ steps.rag-migrate.outputs.exit_status }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Parses vitest-report.json (per-assertion + suite-level failures,
          # #1833) and greps the teed vitest-console.log for the
          # unhandled-error banner (also #1833, console-only — the JSON
          # reporter has no field for it). Redacts postgres:// URLs, Bearer
          # tokens, and any exact match against this job's known secret env
          # values BEFORE either piece reaches the public issue body this
          # step opens (#1851 audit finding 1). Logic + fixtures + tests live
          # in scripts/parse-nightly-failures.mjs /
          # tests/unit/scripts/parse-nightly-failures.test.ts (#1851 audit
          # finding 2 — this used to be untested inline shell/node).
          #
          # Run once per suite (main, rag) and only include a suite's section
          # when THAT suite's own exit code was non-zero (#1863) — either
          # suite can fail independently, and a passing suite's "no per-test
          # detail" fallback would otherwise read as a false failure.
          if [ "$MAIN_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs vitest-report.json vitest-console.log nightly-failing-list.md nightly-unhandled-section.md
            MAIN_SECTION="### apps/main"$'\n\n'"$(cat nightly-failing-list.md)"$'\n'"$(cat nightly-unhandled-section.md)"
          else
            MAIN_SECTION=""
          fi
          if [ "$RAG_STATUS" != "0" ]; then
            node scripts/parse-nightly-failures.mjs apps/rag/rag-vitest-report.json apps/rag/rag-vitest-console.log nightly-rag-failing-list.md nightly-rag-unhandled-section.md
            RAG_SECTION="### apps/rag"$'\n\n'"$(cat nightly-rag-failing-list.md)"$'\n'"$(cat nightly-rag-unhandled-section.md)"
          else
            RAG_SECTION=""
          fi
          # A non-zero RAG migration apply is a schema/infra failure, NOT a test
          # regression — surface it as its own section so triage doesn't chase a
          # phantom test bug (#1893). The teed push log is redacted (public repo,
          # #1851) via the parser's `migrate` mode before it lands here.
          if [ "$RAG_MIGRATE_STATUS" != "0" ] && [ -n "$RAG_MIGRATE_STATUS" ]; then
            node scripts/parse-nightly-failures.mjs migrate apps/rag/rag-migrate-console.log nightly-rag-migrate-section.md
            RAG_MIGRATE_SECTION="### apps/rag — test DB migration apply FAILED (exit $RAG_MIGRATE_STATUS)"$'\n\n'"\`supabase db push\` to the RAG test DB failed before the suite ran, so any RAG results below ran against a stale or absent schema. Triage this as a schema/infra failure, not a test regression."$'\n\n'"$(cat nightly-rag-migrate-section.md)"
          else
            RAG_MIGRATE_SECTION=""
          fi

          BODY=$(cat <<EOF
          ## Nightly full-test failure — $DATE

          Full vitest suite (apps/main and/or apps/rag) failed on \`dev\`. The affected-test path in PR CI didn't catch this — it's either:
          - A test that depends on cross-cutting state (env, schema, fixtures) not in any PR's diff
          - A flake (re-run before chasing)
          - A regression in code the affected-tests heuristic missed (deep utility / dynamic import / etc.)

          **Run**: $RUN_URL

          **Failing tests**:
          $MAIN_SECTION
          $RAG_SECTION
          $RAG_MIGRATE_SECTION

          Triage by re-running the workflow once. If it stays red, it's a real regression — bisect across commits to \`dev\` since the last green nightly.

          (Posted by \`nightly-full-test\`.)
          EOF
          )

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly full-test failed $DATE" \
            --body "$BODY" \
            --label "nightly-failure"
