## Tier 2.5 — PostgREST local config for atc_main_test.
##
## Run with:  postgrest scripts/local-postgrest.conf
## Or auto-started by Playwright's webServer (see playwright.config.ts).
##
## The jwt-secret here is the LOCAL TEST SECRET — never use this value in
## production. Must match tests/security/_test-jwt-fixtures.ts
## TEST_JWT_SECRET (single source of truth for the JWTs minted by
## scripts/print-test-jwts.ts + the unit tests).

db-uri = "postgresql://johnharvieux@localhost:5432/atc_main_test"
db-schemas = "public"
db-anon-role = "anon"

jwt-secret = "atc-local-test-only-ef23d2c129cb73c8-not-for-production"

server-host = "127.0.0.1"
## :54321 is held by scripts/local-supabase-proxy.ts which rewrites
## /rest/v1/<table> → /<table> and forwards to PostgREST here.
server-port = 54331

## Faster reload on schema changes.
db-pool = 10
db-pool-acquisition-timeout = 5
